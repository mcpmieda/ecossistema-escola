name: Request CodeRabbit Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: coderabbit-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    name: Request CodeRabbit review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.base.ref, 'factory/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # Create the issue-style audit/request comments attached to the worker pull request.
      pull-requests: write # GitHub requires PR write scope when the issue-comment target is a pull request.
    steps:
      - name: Request full CodeRabbit review for exact worker SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          post_comment() {
            local payload="$1"
            local response_file
            local status
            response_file=$(mktemp)
            status=$(curl --silent --show-error \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --data "${payload}")
            if [ "${status}" != "201" ]; then
              cat "${response_file}"
              echo "Unexpected GitHub API status: ${status}" >&2
              exit 1
            fi
          }

          marker_payload=$(printf '{"body":"<!-- FACTORY_CODERABBIT_REQUEST {\\"sha\\":\\"%s\\"} -->\\nFactory Merge Train requested CodeRabbit for exact head SHA %s."}' "${HEAD_SHA}" "${HEAD_SHA}")
          post_comment "${marker_payload}"
          post_comment '{"body":"@coderabbitai full review"}'
