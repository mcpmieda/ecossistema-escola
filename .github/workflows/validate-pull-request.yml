name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporary #642: public tracked code and installed dependencies only. Remove before merge.
      - name: Prepare disposable offline validation bundle
        run: |
          git archive --format=tar HEAD > /tmp/bn642-offline.tar
          tar --append --file=/tmp/bn642-offline.tar node_modules
          gzip -1 /tmp/bn642-offline.tar
          sha256sum /tmp/bn642-offline.tar.gz

      - name: Export disposable offline validation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bn642-offline-validation
          path: /tmp/bn642-offline.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Verify
        run: npm run verify
