name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporary, public library only. No real workbooks or production access.
      - name: Obtain the existing public reader for isolated reproduction
        if: github.head_ref == 'fix/bn-553-import-reliability'
        run: |
          mkdir -p "$RUNNER_TEMP/bn-553-reader"
          curl --fail --location --retry 2 --max-time 60 https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js --output "$RUNNER_TEMP/bn-553-reader/xlsx.full.min.cjs"
          sha256sum "$RUNNER_TEMP/bn-553-reader/xlsx.full.min.cjs"

      - name: Export the existing public reader
        if: github.head_ref == 'fix/bn-553-import-reliability'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bn-553-public-reader
          path: ${{ runner.temp }}/bn-553-reader
          retention-days: 1
          if-no-files-found: error

      - name: Verify
        run: npm run verify
