name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare temporary source-only QA bundle for PR809
        if: github.event.pull_request.number == 809
        shell: bash
        run: |
          mkdir -p /tmp/live-data-qa
          git archive --format=tar.gz HEAD > /tmp/live-data-qa/source.tar.gz
          tar --exclude=node_modules/.cache --exclude=node_modules/.wrangler -czf /tmp/live-data-qa/dependencies.tar.gz node_modules
          git rev-parse HEAD > /tmp/live-data-qa/source-commit.txt
          sha256sum /tmp/live-data-qa/*.tar.gz > /tmp/live-data-qa/SHA256SUMS

      - name: Export temporary QA bundle for PR809
        if: github.event.pull_request.number == 809
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-data-qa-809
          path: /tmp/live-data-qa/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Verify
        run: npm run verify
