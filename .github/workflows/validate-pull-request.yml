name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        shell: bash
        run: |
          log="$(mktemp)"
          status=0
          npm run verify >"$log" 2>&1 || status=$?
          # Keep every gate and its exit status. Surface useful failures without flooding
          # reviewers with thousands of successful test lines or repeated DOM dumps.
          node --input-type=module - "$log" <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines = readFileSync(process.argv[2], 'utf8').replace(/\u001b\[[0-9;]*m/g, '').split('\n');
          const selected = new Set();
          for (let i = 0; i < lines.length; i++) {
            if (/\b(?:FAIL|Error|AssertionError|Test Files|Tests|failed|TS\d{4})\b/.test(lines[i])) {
              for (let j = Math.max(0, i - 2); j < Math.min(lines.length, i + 15); j++) selected.add(j);
            }
          }
          for (let i = Math.max(0, lines.length - 100); i < lines.length; i++) selected.add(i);
          console.log([...selected].sort((a, b) => a - b).map((i) => lines[i]).join('\n'));
          NODE
          rm -f "$log"
          exit "$status"
