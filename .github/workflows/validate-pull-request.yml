name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporary branch-only reproduction support for #551. Public parser only.
      # The application already loads this exact version from this same CDN.
      - name: Obtain the existing public parser
        run: |
          mkdir -p /tmp/bn-551-parser
          curl --fail --location --retry 2 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' -o /tmp/bn-551-parser/xlsx.cjs
          node -e "const x = require('/tmp/bn-551-parser/xlsx.cjs'); if (x.version !== '0.20.3') process.exit(1); console.log('SheetJS', x.version)"

      - name: Upload the public parser for isolated reproduction
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bn-551-public-parser
          path: /tmp/bn-551-parser/
          retention-days: 1
          if-no-files-found: error

      - name: Verify
        run: npm run verify
