name: Cloudflare read-only operator

on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-on-demand.yml'
      - 'scripts/cloudflare-operator-v1.ts'
      - 'tests/cloudflare-operator-v1.test.ts'
      - 'scripts/operational-*.ts'
      - 'tests/operational-*.test.ts'
      - 'docs/infra/OPERATIONAL_MONITOR.md'
      - 'docs/infra/CLOUDFLARE_OPERATOR.md'
      - 'docs/infra/AUTOMATION_CREDENTIAL_INVENTORY.md'
  issue_comment:
    types: [created]
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '7 3 * * *'
  workflow_run:
    workflows: ['Deploy Cloudflare Pages']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owner-authored issue that should receive the sanitized report.
        required: false
        type: string
      operation:
        description: Fixed read-only operation.
        required: true
        default: capabilities
        type: choice
        options:
          - capabilities
          - portal
          - monitor
          - daily

permissions: {}

concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'issue_comment' && (github.event.comment.body == '/cloudflare' || github.event.comment.body == '/cloudflare portal'))) && 'cloudflare-readonly-operator' || format('cloudflare-passive-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate-definition:
    name: Validate Cloudflare operator definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run focused operator tests
        # Run the lockfile-pinned vitest through the package script. On-demand package
        # execution would fetch an unpinned release if the local binary were missing.
        run: npm test -- tests/cloudflare-operator-v1.test.ts tests/operational-probes-v1.test.ts tests/operational-telemetry-v1.test.ts tests/operational-monitor-v1.test.ts

  execute:
    name: Execute bounded Cloudflare read-only operation
    if: >-
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.operation == 'capabilities' || inputs.operation == 'portal')) ||
        (
          github.event_name == 'issue_comment' &&
          (
            github.event.comment.body == '/cloudflare' ||
            github.event.comment.body == '/cloudflare portal'
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          INPUT_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            issue="$COMMENT_ISSUE"
            case "$COMMENT_BODY" in
              "/cloudflare") operation="capabilities" ;;
              "/cloudflare portal") operation="portal" ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          else
            issue="$INPUT_ISSUE"
            operation="$INPUT_OPERATION"
          fi
          [[ "$issue" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid issue number"; exit 1; }
          [[ "$operation" = "capabilities" || "$operation" = "portal" ]] || {
            echo "::error::Unsupported Cloudflare operation"
            exit 1
          }
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main
        if: steps.request.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate owner-authored issue
        if: steps.request.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.request.outputs.issue }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" > "$RUNNER_TEMP/cloudflare-issue.json"
          jq -e --arg owner "$OWNER" \
            '.pull_request == null and .user.login == $owner' \
            "$RUNNER_TEMP/cloudflare-issue.json" >/dev/null

      - name: Probe deploy credential without mutation
        if: steps.request.outputs.run == 'true' && steps.request.outputs.operation == 'capabilities'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node --experimental-strip-types scripts/cloudflare-operator-v1.ts
          --operation capabilities
          --token-kind deploy
          --output "$RUNNER_TEMP/cloudflare-deploy.json"

      - name: Probe Hyperdrive credential without mutation
        if: steps.request.outputs.run == 'true' && steps.request.outputs.operation == 'capabilities'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HYPERDRIVE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node --experimental-strip-types scripts/cloudflare-operator-v1.ts
          --operation capabilities
          --token-kind hyperdrive
          --output "$RUNNER_TEMP/cloudflare-hyperdrive.json"

      - name: Diagnose Portal deployment surfaces
        if: steps.request.outputs.run == 'true' && steps.request.outputs.operation == 'portal'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node --experimental-strip-types scripts/cloudflare-operator-v1.ts
          --operation portal-deploy
          --token-kind deploy
          --output "$RUNNER_TEMP/cloudflare-portal-deploy.json"

      - name: Diagnose Portal Hyperdrive surface
        if: steps.request.outputs.run == 'true' && steps.request.outputs.operation == 'portal'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HYPERDRIVE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node --experimental-strip-types scripts/cloudflare-operator-v1.ts
          --operation portal-hyperdrive
          --token-kind hyperdrive
          --output "$RUNNER_TEMP/cloudflare-portal-hyperdrive.json"

      - name: Render sanitized capability matrix
        if: steps.request.outputs.run == 'true' && steps.request.outputs.operation == 'capabilities'
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const root = process.env.RUNNER_TEMP;
          const deploy = JSON.parse(await readFile(`${root}/cloudflare-deploy.json`, 'utf8'));
          const hyperdrive = JSON.parse(await readFile(`${root}/cloudflare-hyperdrive.json`, 'utf8'));
          const byId = (result) => new Map(result.capabilities.map((item) => [item.id, item]));
          const left = byId(deploy);
          const right = byId(hyperdrive);
          const ids = [
            'workers.scripts.read',
            'pages.projects.read',
            'hyperdrive.configs.read',
            'zones.read',
            'analytics.workers.read',
          ];
          const labels = {
            'workers.scripts.read': 'Workers scripts',
            'pages.projects.read': 'Pages projects',
            'hyperdrive.configs.read': 'Hyperdrive configs',
            'zones.read': 'Zones',
            'analytics.workers.read': 'Workers analytics',
          };
          const lines = [
            '### Cloudflare — capability probe read-only',
            '',
            '| Capacidade | CLOUDFLARE_DEPLOY_TOKEN | CLOUDFLARE_HYPERDRIVE_TOKEN |',
            '| --- | --- | --- |',
          ];
          for (const id of ids) {
            lines.push(`| ${labels[id]} | ${left.get(id)?.state ?? 'inconclusive'} | ${right.get(id)?.state ?? 'inconclusive'} |`);
          }
          lines.push(
            '',
            '`accessible` = a credencial atual já consegue consultar essa superfície.',
            '`permission-required` = a API respondeu 401/403; não houve tentativa de ampliar permissão.',
            '`inconclusive` = a chamada respondeu, mas não comprovou a capacidade; não justifica criar token novo.',
            '`unavailable` = indisponibilidade, limite ou falha de transporte; não justifica criar token novo.',
            '',
            'Nenhuma operação mutável foi executada. Nenhuma resposta bruta, token, header de autorização ou origem do Hyperdrive é incluída neste relatório.',
            '',
            `Workflow: ${process.env.RUN_URL}`,
          );
          await writeFile(`${root}/cloudflare-comment.md`, `${lines.join('\n')}\n`, 'utf8');
          NODE

      - name: Render sanitized Portal diagnostic
        if: steps.request.outputs.run == 'true' && steps.request.outputs.operation == 'portal'
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const root = process.env.RUNNER_TEMP;
          const deploy = JSON.parse(await readFile(`${root}/cloudflare-portal-deploy.json`, 'utf8'));
          const hyperdrive = JSON.parse(await readFile(`${root}/cloudflare-portal-hyperdrive.json`, 'utf8'));
          const cell = (value) => value === undefined || value === null
            ? '—'
            : String(value).replace(/[|\r\n]/g, ' ').slice(0, 160);
          const yesNo = (value) => value === true ? 'sim' : value === false ? 'não' : '—';

          const lines = [
            '### Cloudflare — diagnóstico read-only do Portal',
            '',
            '| Superfície | Estado | Evidência sanitizada |',
            '| --- | --- | --- |',
            `| Worker \`student-portal-production\` | ${cell(deploy.worker.state)} | presente: ${yesNo(deploy.worker.present)} · modificado: ${cell(deploy.worker.modifiedAt)} · compatibility date: ${cell(deploy.worker.compatibilityDate)} |`,
            `| Pages \`student-portal-edge\` | ${cell(deploy.pages.state)} | presente: ${yesNo(deploy.pages.present)} · branch: ${cell(deploy.pages.productionBranch)} · deploy: ${cell(deploy.pages.deploymentStatus)} · criado: ${cell(deploy.pages.deploymentCreatedAt)} |`,
            `| Hyperdrive \`PORTAL_DB\` | ${cell(hyperdrive.hyperdrive.state)} | presente: ${yesNo(hyperdrive.hyperdrive.present)} · cache desabilitado: ${yesNo(hyperdrive.hyperdrive.cacheDisabled)} · limite origem: ${cell(hyperdrive.hyperdrive.originConnections)} |`,
            `| Workers Analytics | ${cell(deploy.analytics.state)} | janela: ${cell(deploy.analytics.windowMinutes)} min · requests: ${cell(deploy.analytics.requests)} · errors: ${cell(deploy.analytics.errors)} · CPU p50 máx. bucket: ${cell(deploy.analytics.maxCpuTimeP50)} · CPU p99 máx. bucket: ${cell(deploy.analytics.maxCpuTimeP99)} |`,
            '',
            'O relatório contém apenas metadados operacionais permitidos. Não inclui código do Worker, resposta bruta da Cloudflare, token, header, host/database/user do Hyperdrive, eventos individuais ou dados de estudantes.',
            '',
            `Workflow: ${process.env.RUN_URL}`,
          ];
          await writeFile(`${root}/cloudflare-comment.md`, `${lines.join('\n')}\n`, 'utf8');
          NODE

      - name: Publish sanitized result
        if: steps.request.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.request.outputs.issue }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/cloudflare-comment.md"

      - name: Report fail-closed execution
        if: failure() && steps.request.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.request.outputs.issue }}
        run: >-
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body
          "O operador Cloudflare falhou fechado. Nenhuma operação mutável foi executada e nenhuma credencial foi alterada. Workflow run ${GITHUB_RUN_ID}."

  monitor:
    name: Monitoramento automático — saúde, evidências e lacunas
    if: >-
      github.repository == 'mcpmieda/ecossistema-escola' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == 'refs/heads/main' && (inputs.operation == 'monitor' || inputs.operation == 'daily')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      MONITOR_DIR: ${{ runner.temp }}/monitor
      MONITOR_DAILY: ${{ github.event.schedule == '7 3 * * *' || inputs.operation == 'daily' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout confiável da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Fixar horário e versão do coletor
        shell: bash
        run: |
          echo "MONITOR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MONITOR_NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Conferir sites públicos e qualidade
        continue-on-error: true
        run: node --experimental-strip-types scripts/operational-monitor-v1.ts public

      - name: Consultar publicação e métricas do Portal
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/operational-monitor-v1.ts deployment

      - name: Consultar telemetria agregada do uso real
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/operational-monitor-v1.ts telemetry

      - name: Conferir Hyperdrive sem alterar configuração
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HYPERDRIVE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/operational-monitor-v1.ts hyperdrive

      - name: Ler publicação oficial e auditoria Entra existente
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/operational-monitor-v1.ts github

      - name: Gerar resumo legível e relatório técnico
        if: always()
        run: node --experimental-strip-types scripts/operational-monitor-v1.ts report

      - name: Guardar relatório periódico por 14 dias
        if: always() && env.MONITOR_DAILY != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monitor-detalhado-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/monitor/report.json
            ${{ runner.temp }}/monitor/report.md
          retention-days: 14
          if-no-files-found: error

      - name: Guardar consolidado diário por 90 dias
        if: always() && env.MONITOR_DAILY == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monitor-diario-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/monitor/report.json
            ${{ runner.temp }}/monitor/report.md
          retention-days: 90
          if-no-files-found: error

      - name: Atualizar painel e registrar mudanças de alertas
        if: env.MONITOR_DAILY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/operational-monitor-publish-v1.ts

      - name: Sinalizar problemas observados
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          try {
            const report = JSON.parse(await readFile(`${process.env.MONITOR_DIR}/report.json`, 'utf8'));
            if (report.alerts.length) {
              console.error('Foram encontrados alertas. Consulte o resumo desta execução.');
              process.exitCode = 1;
            }
          } catch {
            console.error('Relatório indisponível. A execução não comprova saúde do sistema.');
            process.exitCode = 1;
          }
          NODE
