name: BN 557 read-only diagnostics

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/bn-557-persistent-unavailable' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Read fixed aggregate queries only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRADEBOOK_D1_BINDING_CONFIG: ${{ secrets.GRADEBOOK_D1_BINDING_CONFIG }}
        run: |
          node --input-type=module <<'NODE'
          // No checkout, dependency execution, export, writes, raw errors or raw results.
          try {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const binding = JSON.parse(process.env.GRADEBOOK_D1_BINDING_CONFIG || '{}');
            if (!account || !token || binding.binding !== 'GRADEBOOK_D1' || typeof binding.database_id !== 'string') {
              console.log(JSON.stringify({ status: 'credentials-unavailable' }));
              process.exit(0);
            }
            const url = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/d1/database/${encodeURIComponent(binding.database_id)}/query`;
            const queries = [
              ['schema', 'SELECT COUNT(*) AS count, MAX(version) AS maximum FROM gradebook_schema_migrations'],
              ['sources', 'SELECT COUNT(*) AS count, MAX(current_version) AS maximum FROM source_file_streams'],
              ['batches', 'SELECT COUNT(*) AS count, MAX(current_version) AS maximum FROM import_batch_streams'],
              ['entities', 'SELECT COUNT(*) AS count, MAX(current_version) AS maximum FROM academic_entity_streams'],
              ['records', 'SELECT COUNT(*) AS count, MAX(current_version) AS maximum FROM academic_record_streams'],
              ['associations', 'SELECT COUNT(*) AS count, MAX(current_version) AS maximum FROM logical_source_record_streams'],
              ['annual-current', "SELECT COUNT(*) AS count, MAX(length(CAST(v.payload_json AS BLOB))) AS maximum, SUM(length(CAST(v.payload_json AS BLOB))) AS total_bytes, MAX(json_array_length(v.payload_json, '$.value.coverage.reasons')) AS max_reasons FROM academic_record_streams s JOIN academic_record_versions v ON v.academic_year_id=s.academic_year_id AND v.record_kind=s.record_kind AND v.stream_key=s.stream_key AND v.version=s.current_version WHERE s.record_kind='annual-result'"],
              ['source-payload-size', 'SELECT COUNT(*) AS count, MAX(length(CAST(payload_json AS BLOB))) AS maximum FROM source_file_versions'],
              ['foreign-key-integrity', 'SELECT COUNT(*) AS count FROM pragma_foreign_key_check'],
              ['missing-current-versions', 'SELECT COUNT(*) AS count FROM academic_record_streams s LEFT JOIN academic_record_versions v ON v.academic_year_id=s.academic_year_id AND v.record_kind=s.record_kind AND v.stream_key=s.stream_key AND v.version=s.current_version WHERE v.version IS NULL']
            ];
            const keys = new Set(['count','maximum','total_bytes','max_reasons']);
            for (const [label, sql] of queries) {
              try {
                if (!sql.startsWith('SELECT ') || sql.includes(';')) throw new Error('not-read-only');
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ sql, params: [] }),
                  signal: AbortSignal.timeout(35000)
                });
                const value = await response.json();
                if (!response.ok || value.success !== true || !Array.isArray(value.result)) {
                  const codes = Array.isArray(value.errors) ? value.errors.map(e => e.code).filter(n => typeof n === 'number' && Number.isFinite(n)) : [];
                  console.log(JSON.stringify({ label, status: 'query-unavailable', http: response.status, codes }));
                  if (response.status === 401 || response.status === 403) break;
                  continue;
                }
                const rows = value.result[0]?.results;
                if (!Array.isArray(rows) || rows.length !== 1) throw new Error('unexpected-result');
                const row = rows[0];
                if (!row || Object.entries(row).some(([key, value]) => !keys.has(key) || !(value === null || (typeof value === 'number' && Number.isFinite(value))))) throw new Error('unsafe-result');
                console.log(JSON.stringify({ label, status: 'ok', metrics: row }));
              } catch {
                console.log(JSON.stringify({ label, status: 'query-unavailable' }));
              }
            }
          } catch {
            console.log(JSON.stringify({ status: 'diagnostic-unavailable' }));
          }
          NODE
