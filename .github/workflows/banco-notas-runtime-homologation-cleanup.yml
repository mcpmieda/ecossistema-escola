name: Banco de Notas runtime homologation cleanup

on:
  push:
    branches:
      - feat/banco-de-notas-foundation
    paths:
      - 'docs/evidence/BancoNotas-Bearer-Ownership-Homologation-2026-08-27.json'
      - 'docs/evidence/BancoNotas-D1-Binding-Atomicity-Homologation-2026-08-27.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banco-notas-runtime-homologation
  cancel-in-progress: false

jobs:
  remove-isolated-runtime:
    name: Remove isolated Banco de Notas homologation runtime
    if: github.ref == 'refs/heads/feat/banco-de-notas-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve the exact temporary Pages preview deployment
        id: deployment
        shell: pwsh
        run: |
          $evidence = Get-Content `
            -LiteralPath 'docs/evidence/BancoNotas-Bearer-Ownership-Homologation-2026-08-27.json' `
            -Raw | ConvertFrom-Json
          $deploymentId = [string]$evidence.deployment.pagesDeploymentId
          if ([string]::IsNullOrWhiteSpace($deploymentId)) {
            throw 'A evidência não contém o ID exato do preview Pages temporário.'
          }
          "deployment_id=$deploymentId" >> $env:GITHUB_OUTPUT

      - name: Delete only the exact temporary Pages preview deployment
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: >-
          npx wrangler pages deployment delete
          $env:PAGES_DEPLOYMENT_ID
          --project-name ecossistema-escola
          --force

      - name: Record cleanup result
        run: echo 'RUNTIME_HOMOLOGATION_PAGES_PREVIEW_REMOVED'
