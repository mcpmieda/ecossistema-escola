name: Temporary reviewer lockfile oracle

on:
  pull_request:
    paths:
      - '.coderabbit.yaml'
      - 'infra/factory/merge-train-gate.mjs'
      - 'infra/factory/merge-train-gate.test.mjs'
      - 'infra/factory/sonar-scanner/package.json'
      - '.github/workflows/merge-train-semgrep.yml'
      - '.github/workflows/merge-train-sonar.yml'
      - '.github/workflows/tmp-reviewer-oracle.yml'

permissions:
  contents: read

jobs:
  generate:
    name: Generate isolated reviewer lockfile and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked application baseline for Prettier
        run: npm ci
      - name: Generate isolated exact SonarScanner lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix infra/factory/sonar-scanner
      - name: Install isolated locked scanner and verify exact version
        run: |
          npm ci --prefix infra/factory/sonar-scanner
          test "$(node -p "require('./infra/factory/sonar-scanner/node_modules/@sonar/scan/package.json').version")" = "5.0.0"
      - name: Format changed trusted files
        run: >-
          npx prettier --write
          .coderabbit.yaml
          infra/factory/merge-train-gate.mjs
          infra/factory/merge-train-gate.test.mjs
          infra/factory/sonar-scanner/package.json
          .github/workflows/merge-train-semgrep.yml
          .github/workflows/merge-train-sonar.yml
      - name: Upload exact generated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewer-oracle-${{ github.run_id }}
          path: |
            .coderabbit.yaml
            infra/factory/merge-train-gate.mjs
            infra/factory/merge-train-gate.test.mjs
            infra/factory/sonar-scanner/package.json
            infra/factory/sonar-scanner/package-lock.json
            .github/workflows/merge-train-semgrep.yml
            .github/workflows/merge-train-sonar.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
