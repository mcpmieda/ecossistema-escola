name: Semgrep

on:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact worker SHA that must be analyzed.
        required: true
        type: string
      pr_number:
        description: Worker PR that must still point to expected_sha.
        required: true
        type: string

permissions: {}

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.expected_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact revision under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Restore trusted ignore policy
        shell: bash
        run: |
          set -euo pipefail
          find candidate -type f -name .semgrepignore -delete
          if [ -f trusted/.semgrepignore ]; then
            cp trusted/.semgrepignore candidate/.semgrepignore
          fi

      - name: Install pinned Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir semgrep==1.175.0
          test "$(semgrep --version)" = "1.175.0"

      - name: Run Semgrep security rules
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          echo "Semgrep analyzed SHA: $(git rev-parse HEAD)"
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --disable-nosem \
            --error \
            --metrics=off \
            --exclude .git \
            .

  evidence:
    name: Publish Semgrep reviewer evidence
    if: always() && github.event_name == 'workflow_dispatch'
    needs: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      REVIEW_RESULT: ${{ needs.semgrep.result }}
      REVIEW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Persist SHA-bound reviewer result
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq ".head.sha")
          conclusion="${REVIEW_RESULT}"
          if [ "${current_sha}" != "${EXPECTED_SHA}" ]; then
            conclusion="stale"
          fi
          payload=$(jq -cn \
            --arg reviewer "Semgrep" \
            --arg sha "${EXPECTED_SHA}" \
            --arg conclusion "${conclusion}" \
            --argjson run_id "${REVIEW_RUN_ID}" \
            "{schema_version:1,reviewer:\$reviewer,sha:\$sha,conclusion:\$conclusion,run_id:\$run_id}")
          encoded=$(printf '%s' "${payload}" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          body="<!-- FACTORY_REVIEWER_EVIDENCE ${encoded} -->"$'\n'"Semgrep reviewer run ${REVIEW_RUN_ID} concluded \`${conclusion}\` for exact worker SHA \`${EXPECTED_SHA}\`."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" >/dev/null
          test "${conclusion}" = "success"
