name: Semgrep

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir semgrep==1.175.0
          semgrep --version

      - name: Run Semgrep security rules
        shell: bash
        run: |
          set -euo pipefail
          echo "Semgrep head SHA: ${GITHUB_SHA}"
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude .git \
            .
