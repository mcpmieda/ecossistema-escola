name: BN 561 public source snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive public tracked source only
        run: git archive --format=tar HEAD | gzip > /tmp/bn-561-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bn-561-public-source
          path: /tmp/bn-561-source.tar.gz
          retention-days: 1
          if-no-files-found: error
