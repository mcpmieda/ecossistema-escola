name: Student Portal runtime gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prove_production_hyperdrive:
        description: Run a bounded private synthetic proof through the production Portal Hyperdrive
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: student-portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres:
    name: Portal native PostgreSQL and role isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: portal_test_admin
          POSTGRES_DB: portal705_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portal_test_admin -d portal705_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Replay migrations with a non-superuser and prove runtime ACL
        env:
          PORTAL_TEST_DATABASE_URL: postgres://portal_test_admin@127.0.0.1:5432/portal705_test
        run: npm run test:student-portal-postgres

  runtime-proof:
    name: Bounded private Hyperdrive proof
    if: github.event_name == 'workflow_dispatch' && inputs.prove_production_hyperdrive
    needs: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify expected main and all applications
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          npm run verify
      - name: Prove real Hyperdrive and remove temporary Worker
        run: node workers/student-portal/prove-runtime.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure temporary Worker cleanup
        if: always()
        run: node workers/student-portal/prove-runtime.mjs --cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# The single official deploy-cloudflare-pages workflow verifies this SQL gate
# again, then publishes the Portal Worker before its Pages consumers.
