name: Student Portal runtime gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Portal native PostgreSQL and role isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: portal_test_admin
          POSTGRES_DB: portal705_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portal_test_admin -d portal705_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Replay migrations with a non-superuser and prove runtime ACL
        env:
          PORTAL_TEST_DATABASE_URL: postgres://portal_test_admin@127.0.0.1:5432/portal705_test
        run: npm run test:student-portal-postgres

# The single official deploy-cloudflare-pages workflow verifies this SQL gate
# again, then publishes the Portal Worker before its Pages consumers.
