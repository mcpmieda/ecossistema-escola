name: Temporary repair formatter

on:
  push:
    branches:
      - fix/logout-visual-gate
    paths:
      - .github/workflows/format-repair.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/logout-visual-gate

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format changed files
        run: >-
          npx prettier --write
          'functions/[[path]].ts'
          tests/routes.test.ts
          PROJECT_STATE.md
          VERIFICATION.md
          docs/AUDITORIA_VISUAL_CENTRO_ADMIN_V0.2.md

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'functions/[[path]].ts' tests/routes.test.ts PROJECT_STATE.md VERIFICATION.md docs/AUDITORIA_VISUAL_CENTRO_ADMIN_V0.2.md
          git commit -m 'Format logout visual repair'
          git push origin HEAD:fix/logout-visual-gate
