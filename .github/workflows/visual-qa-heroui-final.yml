name: Temporal QA HeroUI final

on:
  push:
    branches:
      - redesign/heroui-native-v1
    paths:
      - .github/workflows/visual-qa-heroui-final.yml

permissions:
  contents: read

jobs:
  temporal-qa:
    name: Prove real-time HeroUI ambient motion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build candidate
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test ! -d src/components/ui
          if grep -R --line-number --fixed-strings '@/components/ui/' src; then
            echo 'Legacy UI facade import detected.' >&2
            exit 1
          fi

      - name: Create real component motion fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > motion-fixture.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>HeroUI real-time motion proof</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/motion-fixture.tsx"></script>
            </body>
          </html>
          HTML

          cat > src/motion-fixture.tsx <<'TSX'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { Surface } from '@heroui/react';
          import './styles.css';
          import { AmbientConstellation } from './components/ambient-constellation';

          function Fixture() {
            return (
              <div className="platform-shell min-h-svh p-10">
                <AmbientConstellation className="fixed" intensity="strong" placement="right" />
                <Surface variant="transparent" className="living-page-header relative z-10 mx-auto max-w-4xl">
                  <AmbientConstellation intensity="strong" placement="right" />
                  <div className="living-page-header__content">
                    <p className="text-sm font-semibold text-accent">Temporal QA</p>
                    <h1 className="mt-3 text-3xl font-semibold">Living UI em tempo real</h1>
                  </div>
                </Surface>
              </div>
            );
          }

          createRoot(document.getElementById('root')!).render(<Fixture />);
          TSX

          cat > /tmp/prove-motion.mjs <<'JS'
          import fs from 'node:fs/promises';

          const [, , port, output, reduced = 'false'] = process.argv;
          const list = JSON.parse(await fs.readFile(`/tmp/tabs-${port}.json`, 'utf8'));
          const target = list.find((entry) => entry.type === 'page' && entry.url.includes('motion-fixture.html'));
          if (!target?.webSocketDebuggerUrl) throw new Error('Chrome page target not found');

          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });

          let sequence = 0;
          const pending = new Map();
          ws.addEventListener('message', (event) => {
            const message = JSON.parse(event.data);
            if (!message.id || !pending.has(message.id)) return;
            const { resolve, reject } = pending.get(message.id);
            pending.delete(message.id);
            if (message.error) reject(new Error(JSON.stringify(message.error)));
            else resolve(message.result);
          });

          const command = (method, params = {}) =>
            new Promise((resolve, reject) => {
              const id = ++sequence;
              pending.set(id, { resolve, reject });
              ws.send(JSON.stringify({ id, method, params }));
            });

          const evaluate = async (expression) => {
            const response = await command('Runtime.evaluate', {
              expression,
              returnByValue: true,
              awaitPromise: true,
            });
            if (response.exceptionDetails) throw new Error(JSON.stringify(response.exceptionDetails));
            return response.result.value;
          };

          await command('Runtime.enable');
          await evaluate(`new Promise((resolve, reject) => {
            const deadline = performance.now() + 8000;
            const poll = () => {
              const layer = document.querySelector('.platform-shell > .ambient-constellation .ambient-constellation__layer--a');
              if (layer) return resolve(true);
              if (performance.now() > deadline) return reject(new Error('ambient layer timeout'));
              setTimeout(poll, 50);
            };
            poll();
          })`);

          const sampleExpression = `(() => {
            const layer = document.querySelector('.platform-shell > .ambient-constellation .ambient-constellation__layer--a');
            const particles = [...document.querySelectorAll('.platform-shell > .ambient-constellation .ambient-constellation__particle')];
            const animation = layer.getAnimations()[0] ?? null;
            const style = getComputedStyle(layer);
            return {
              transform: style.transform,
              animationName: style.animationName,
              animationPlayState: style.animationPlayState,
              currentTime: animation?.currentTime ?? null,
              playState: animation?.playState ?? null,
              particleCount: particles.length,
              maxParticle: Math.max(...particles.map((node) => node.getBoundingClientRect().width)),
            };
          })()`;

          const first = await evaluate(sampleExpression);
          await new Promise((resolve) => setTimeout(resolve, 3500));
          const second = await evaluate(sampleExpression);

          const proof = { reduced: reduced === 'true', first, second };
          await fs.writeFile(output, `${JSON.stringify(proof, null, 2)}\n`);

          if (first.particleCount < 96) throw new Error(`particle count ${first.particleCount}`);
          if (first.maxParticle > 1.5) throw new Error(`particle size ${first.maxParticle}`);

          if (reduced === 'true') {
            if (first.animationName !== 'none' || second.animationName !== 'none') {
              throw new Error(`reduced-motion animation still active: ${first.animationName}`);
            }
          } else {
            if (first.currentTime === null || second.currentTime === null) {
              throw new Error('CSS animation object missing');
            }
            if (second.currentTime - first.currentTime < 2500) {
              throw new Error(`animation clock did not advance enough: ${first.currentTime} -> ${second.currentTime}`);
            }
            if (first.transform === second.transform) {
              throw new Error(`computed transform did not change: ${first.transform}`);
            }
            if (first.playState !== 'running' || second.playState !== 'running') {
              throw new Error(`animation not running: ${first.playState} / ${second.playState}`);
            }
          }

          ws.close();
          console.log(JSON.stringify(proof));
          JS

      - name: Prove normal motion with real elapsed time
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temporal-evidence
          npm run dev -- --host 127.0.0.1 > /tmp/vite-temporal.log 2>&1 &
          vite_pid=$!
          chrome_pid=''
          cleanup() {
            if [ -n "${chrome_pid}" ]; then kill "${chrome_pid}" 2>/dev/null || true; fi
            kill "${vite_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5173/motion-fixture.html > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:5173/motion-fixture.html > /dev/null

          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "${chrome}" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-temporal-normal 'http://127.0.0.1:5173/motion-fixture.html' > /tmp/chrome-temporal-normal.log 2>&1 &
          chrome_pid=$!

          for _ in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:9222/json/list > /tmp/tabs-9222.json; then
              break
            fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:9222/json/list > /tmp/tabs-9222.json
          node /tmp/prove-motion.mjs 9222 temporal-evidence/normal-motion.json false

      - name: Prove reduced-motion fallback
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "${chrome}" --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion --remote-debugging-port=9223 --user-data-dir=/tmp/chrome-temporal-reduced 'http://127.0.0.1:5173/motion-fixture.html' > /tmp/chrome-temporal-reduced.log 2>&1 &
          chrome_pid=$!
          cleanup() { kill "${chrome_pid}" 2>/dev/null || true; }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:9223/json/list > /tmp/tabs-9223.json; then
              break
            fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:9223/json/list > /tmp/tabs-9223.json
          node /tmp/prove-motion.mjs 9223 temporal-evidence/reduced-motion.json true

      - name: Publish temporal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heroui-native-temporal-proof-${{ github.run_id }}
          path: temporal-evidence
          if-no-files-found: warn
          retention-days: 14
