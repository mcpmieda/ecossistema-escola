name: Visual QA HeroUI final

on:
  push:
    branches:
      - redesign/heroui-native-v1
    paths:
      - .github/workflows/visual-qa-heroui-final.yml

permissions:
  contents: read

jobs:
  visual-qa:
    name: Validate final HeroUI atmosphere
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test ! -d src/components/ui
          ! grep -R --line-number --fixed-strings '@/components/ui/' src

      - name: Create isolated visual fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > visual-final.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>HeroUI final visual QA</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/visual-final.tsx"></script>
              <script>
                (() => {
                  const sample = () => {
                    const layer = document.querySelector('.ambient-constellation__layer--a');
                    const particles = [...document.querySelectorAll('.ambient-constellation__particle')];
                    const aurora = document.querySelector('.platform-shell');
                    if (!layer || particles.length === 0 || !aurora) return setTimeout(sample, 100);
                    document.body.dataset.motionStart = getComputedStyle(layer).transform;
                    document.body.dataset.particleCount = String(particles.length);
                    document.body.dataset.maxParticle = String(Math.max(...particles.map((node) => node.getBoundingClientRect().width)));
                    setTimeout(() => {
                      document.body.dataset.motionLater = getComputedStyle(layer).transform;
                      document.body.dataset.ready = 'true';
                    }, 3200);
                  };
                  sample();
                })();
              </script>
            </body>
          </html>
          HTML

          cat > src/visual-final.tsx <<'TSX'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { Surface } from '@heroui/react';
          import './styles.css';
          import { AmbientConstellation } from './components/ambient-constellation';
          import { SidebarContent } from './platform/navigation';
          import { LoadingWorkspace, PageContent } from './platform/pages';
          import type { PlatformRoute, PlatformSnapshotContract } from '../shared/platform-contract';

          const modules: PlatformSnapshotContract['coreModules'] = [
            { id: 'overview', name: 'Visão geral', description: 'Resumo operacional', route: 'visao-geral', state: 'validation', requiredRole: 'ADMINISTRADOR', capabilities: ['platform.overview.read'] },
            { id: 'operation', name: 'Operação', description: 'Saúde e confiabilidade', route: 'operacao', state: 'validation', requiredRole: 'ADMINISTRADOR', capabilities: ['platform.health.read'] },
            { id: 'systems', name: 'Sistemas', description: 'Catálogo modular', route: 'sistemas', state: 'validation', requiredRole: 'ADMINISTRADOR', capabilities: ['platform.modules.read'] },
            { id: 'audit', name: 'Auditoria', description: 'Rastreabilidade', route: 'auditoria', state: 'validation', requiredRole: 'ADMINISTRADOR', capabilities: ['platform.audit.read'] },
            { id: 'settings', name: 'Configurações', description: 'Governança', route: 'configuracoes', state: 'validation', requiredRole: 'ADMINISTRADOR', capabilities: ['platform.settings.read'] },
            { id: 'publications', name: 'Publicações', description: 'Próxima fase', route: 'publicacoes', state: 'planned', requiredRole: 'ADMINISTRADOR', capabilities: ['publications.read'] },
            { id: 'pages', name: 'Páginas', description: 'Próxima fase', route: 'paginas', state: 'planned', requiredRole: 'ADMINISTRADOR', capabilities: ['pages.read'] },
          ];

          const snapshot: PlatformSnapshotContract = {
            version: 'native-final-qa', releaseState: 'validation', generatedAt: '2026-08-25T10:00:00.000Z', correlationId: 'final-qa',
            foundation: { status: 'ok', sharePointListCount: 4, expectedPlatformListsPresent: true, missingPlatformLists: [] },
            operational: { status: 'nominal', recentAuditFailureCount: 0, healthContractsConfigured: 1, healthContractsMissing: 0, lastAuditAt: '2026-08-25T09:55:00.000Z', recoveryStatus: 'verified', recoveryVerifiedAt: '2026-08-25T09:56:00.000Z', recoveryEvidenceRef: 'fixture', recoveryScope: 'fixture-only' },
            coreModules: modules,
            registeredModules: [{ id: 'mod-1', key: 'notas', name: 'Banco de Notas', baseRoute: '/notas', version: '2.0', status: 'installed', order: 1, healthEndpoint: '/health', updatedAt: '2026-08-25T09:30:00.000Z', contractVersion: 2, requiredCapabilities: ['platform.modules.read'], integrationState: 'ready', integrationIssues: [], available: true }],
            configurations: [{ id: 'cfg-1', key: 'ano-letivo', scope: 'global', version: '2026', active: true, effectiveFrom: '2026-01-01', effectiveUntil: '', updatedAt: '2026-08-20T12:00:00.000Z' }],
            recentAudit: [], migrations: [],
          };

          const params = new URLSearchParams(location.search);
          const route = (params.get('route') || 'visao-geral') as PlatformRoute;
          const loading = params.get('mode') === 'loading';

          function Fixture() {
            if (loading) return <div className="platform-shell min-h-svh p-8"><AmbientConstellation className="fixed" intensity="strong" placement="right" /><div className="relative z-10 mx-auto max-w-[1180px]"><LoadingWorkspace /></div></div>;
            return <div className="platform-shell min-h-svh lg:grid lg:grid-cols-[292px_minmax(0,1fr)]"><AmbientConstellation className="fixed" intensity="strong" placement="right" /><aside className="hidden h-svh border-r border-border/60 lg:block"><SidebarContent route={route} modules={modules} loading={false} /></aside><div className="relative z-10 min-w-0"><Surface variant="transparent" className="glass-bar border-b border-border/65"><div className="flex h-16 items-center px-8 text-sm font-medium">Centro / QA final HeroUI</div></Surface><main className="mx-auto max-w-[1320px] p-6 lg:p-8"><div className="route-stage"><PageContent route={route} snapshot={snapshot} /></div></main></div></div>;
          }

          createRoot(document.getElementById('root')!).render(<Fixture />);
          TSX

      - name: Capture final Chrome evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-final-evidence
          npm run dev -- --host 127.0.0.1 > /tmp/vite-final.log 2>&1 &
          vite_pid=$!
          trap 'kill ${vite_pid} 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do curl --silent --fail http://127.0.0.1:5173/ >/dev/null && break || sleep 0.25; done
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          capture() { "${chrome}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$3" --virtual-time-budget=5200 --screenshot="visual-final-evidence/$1.png" --dump-dom "$2" > "visual-final-evidence/$1.html"; }
          capture login-desktop 'http://127.0.0.1:5173/' '1440,900'
          capture overview-desktop 'http://127.0.0.1:5173/visual-final.html?route=visao-geral' '1440,900'
          capture planned-desktop 'http://127.0.0.1:5173/visual-final.html?route=publicacoes' '1440,900'
          capture loading-desktop 'http://127.0.0.1:5173/visual-final.html?mode=loading' '1440,900'
          capture overview-mobile 'http://127.0.0.1:5173/visual-final.html?route=visao-geral' '390,844'
          grep --quiet 'data-ready="true"' visual-final-evidence/overview-desktop.html
          start="$(grep -o 'data-motion-start="[^"]*"' visual-final-evidence/overview-desktop.html | head -1)"
          later="$(grep -o 'data-motion-later="[^"]*"' visual-final-evidence/overview-desktop.html | head -1)"
          test -n "${start}" && test -n "${later}" && test "${start}" != "${later}"
          max_particle="$(grep -o 'data-max-particle="[^"]*"' visual-final-evidence/overview-desktop.html | head -1 | cut -d'"' -f2)"
          count="$(grep -o 'data-particle-count="[^"]*"' visual-final-evidence/overview-desktop.html | head -1 | cut -d'"' -f2)"
          python3 - "${max_particle}" "${count}" <<'PY'
          import sys
          assert float(sys.argv[1]) <= 1.5
          assert int(sys.argv[2]) >= 96
          print(f'max_particle={float(sys.argv[1]):.3f}px particle_count={int(sys.argv[2])}')
          PY
          printf 'motion_start=%s\nmotion_later=%s\n' "${start}" "${later}" > visual-final-evidence/motion-proof.txt

      - name: Capture reduced-motion fallback
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "${chrome}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-prefers-reduced-motion --window-size=1440,900 --virtual-time-budget=3500 --screenshot=visual-final-evidence/overview-reduced-motion.png 'http://127.0.0.1:5173/visual-final.html?route=visao-geral'
          test -s visual-final-evidence/overview-reduced-motion.png

      - name: Publish final visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heroui-native-final-visual-${{ github.run_id }}
          path: visual-final-evidence
          if-no-files-found: error
          retention-days: 14
