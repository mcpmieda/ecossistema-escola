name: Format HeroUI native candidate

on:
  push:
    branches:
      - redesign/heroui-native-v1
    paths:
      - .github/workflows/format-heroui-native.yml

permissions:
  contents: write

concurrency:
  group: format-heroui-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-candidate:
    name: Format and commit native HeroUI candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: redesign/heroui-native-v1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run format

      - name: Verify formatted result
        run: npm run format:check

      - name: Commit formatted sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add src/App.tsx src/platform/navigation.tsx src/platform/operations-page.tsx src/platform/pages.tsx src/platform/presentation.tsx src/platform/search.tsx
          if git diff --cached --quiet; then
            echo 'No formatting changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(ui): formatar redesign HeroUI nativo'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/mcpmieda/ecossistema-escola.git"
          git push origin HEAD:redesign/heroui-native-v1
