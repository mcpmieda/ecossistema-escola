name: Format HeroUI native candidate

on:
  push:
    branches:
      - redesign/heroui-native-v1
    paths:
      - .github/workflows/format-heroui-native.yml
      - src/App.tsx
      - src/platform/navigation.tsx
      - src/platform/operations-page.tsx
      - src/platform/pages.tsx
      - src/platform/presentation.tsx
      - src/platform/search.tsx

permissions:
  contents: read

concurrency:
  group: format-heroui-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-candidate:
    name: Format native HeroUI candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run format

      - name: Verify formatted result
        run: npm run format:check

      - name: Publish formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heroui-native-formatted-${{ github.run_id }}
          path: |
            src/App.tsx
            src/platform/navigation.tsx
            src/platform/operations-page.tsx
            src/platform/pages.tsx
            src/platform/presentation.tsx
            src/platform/search.tsx
          if-no-files-found: error
          retention-days: 1
