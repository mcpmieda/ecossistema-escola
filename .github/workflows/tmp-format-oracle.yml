name: Temporary Prettier oracle

on:
  pull_request:
    paths:
      - 'infra/factory/hosted-opencode-executor.mjs'
      - '.github/workflows/tmp-format-oracle.yml'

permissions:
  contents: read

jobs:
  format:
    name: Format hosted OpenCode executor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format exact file with locked Prettier
        run: npx prettier --write infra/factory/hosted-opencode-executor.mjs

      - name: Upload exact formatted file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prettier-oracle-${{ github.run_id }}
          path: infra/factory/hosted-opencode-executor.mjs
          if-no-files-found: error
          retention-days: 1
