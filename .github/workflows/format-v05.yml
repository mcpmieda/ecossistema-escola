name: Temporary v0.5 formatter

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: format-v05-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format and verify v0.5
    if: github.head_ref == 'feat/centro-admin-v0.5-operational-health'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout v0.5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/centro-admin-v0.5-operational-health

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format sources
        run: npm run format

      - name: Verify application
        run: npm run verify

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infra/validation/validate-semantic-contract.mjs server/platform/snapshot.ts specs/semantic-assurance.json tests/platform-snapshot.test.ts
          git commit -m 'Format v0.5 operational health changes'
          git push origin HEAD:feat/centro-admin-v0.5-operational-health
