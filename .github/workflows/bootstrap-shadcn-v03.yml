name: Temporary shadcn bootstrap v0.3

on:
  push:
    branches:
      - feat/centro-admin-visual-v0.3
    paths:
      - .github/workflows/bootstrap-shadcn-v03.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/centro-admin-visual-v0.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Add Tailwind Vite integration
        run: npm install --save-dev tailwindcss @tailwindcss/vite

      - name: Initialize shadcn
        run: npx shadcn@latest init -d --base radix

      - name: Add required primitives
        run: >-
          npx shadcn@latest add
          button card badge separator skeleton table avatar dropdown-menu tooltip sheet

      - name: Commit generated design-system foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Add shadcn foundation for Centro visual v0.3'
          git push origin HEAD:feat/centro-admin-visual-v0.3
