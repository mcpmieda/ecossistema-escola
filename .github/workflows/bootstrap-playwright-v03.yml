name: Temporary Playwright lock bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: playwright-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Lock Playwright dependency
    if: github.head_ref == 'feat/centro-admin-visual-v0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/centro-admin-visual-v0.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Lock Playwright for disposable browser QA
        run: npm install --save-dev --save-exact playwright@1.62.1

      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet package.json package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Lock Playwright for visual QA'
          git push origin HEAD:feat/centro-admin-visual-v0.3
