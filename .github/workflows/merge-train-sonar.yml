name: Sonar

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact worker SHA that must be analyzed.
        required: true
        type: string

permissions: {}

concurrency:
  group: sonar-${{ github.ref }}-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Read only the exact worker revision selected by the trusted Control Plane.
    steps:
      - name: Checkout exact worker revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact SHA and Sonar configuration
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -n "${SONAR_PROJECT_KEY}" || { echo 'SONAR_PROJECT_KEY repository variable is required.' >&2; exit 1; }
          test -n "${SONAR_ORGANIZATION}" || { echo 'SONAR_ORGANIZATION repository variable is required.' >&2; exit 1; }
          test -n "${SONAR_TOKEN}" || { echo 'SONAR_TOKEN repository secret is required.' >&2; exit 1; }

      - name: Run SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,dist/**,coverage/**,.git/**
