name: Sonar
run-name: Sonar PR ${{ inputs.pr_number }} @ ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact worker SHA that must be analyzed.
        required: true
        type: string
      pr_number:
        description: Worker PR that must still point to expected_sha.
        required: true
        type: string

permissions: {}

concurrency:
  group: sonar-${{ inputs.expected_sha }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # Confirm the worker PR still points to the exact SHA being scanned.
    steps:
      - name: Checkout trusted scanner lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact worker revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for official SonarScanner NPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trusted/infra/factory/sonar-scanner/package-lock.json

      - name: Validate exact SHA, PR head and Sonar configuration
        id: config
        shell: bash
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq ".head.sha")" = "${EXPECTED_SHA}"
          test -n "${SONAR_PROJECT_KEY}" || { echo 'SONAR_PROJECT_KEY repository variable is required.' >&2; exit 1; }
          test -n "${SONAR_ORGANIZATION}" || { echo 'SONAR_ORGANIZATION repository variable is required.' >&2; exit 1; }
          test -n "${SONAR_TOKEN}" || { echo 'SONAR_TOKEN repository secret is required.' >&2; exit 1; }
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 12)) process.exit(1)"

      - name: Install trusted locked scanner dependencies
        shell: bash
        run: npm ci --prefix trusted/infra/factory/sonar-scanner

      - name: Verify pinned official SonarScanner NPM
        shell: bash
        run: |
          set -euo pipefail
          scanner_root="trusted/infra/factory/sonar-scanner"
          test "$(node -p "require('./${scanner_root}/node_modules/@sonar/scan/package.json').version")" = "5.0.0"
          "${scanner_root}/node_modules/.bin/sonar-scanner-npm" --version

      - name: Run SonarQube Cloud scan
        shell: bash
        working-directory: candidate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/trusted/infra/factory/sonar-scanner/node_modules/.bin/sonar-scanner-npm" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.sources=. \
            -Dsonar.exclusions='node_modules/**,dist/**,coverage/**,.git/**'

  evidence:
    name: Publish Sonar reviewer evidence
    if: always()
    needs: sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # Read the exact head and persist evidence on a PR-backed issue.
      issues: write # Retained for issue-comment compatibility across GitHub token permission models.
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      REVIEW_RESULT: ${{ needs.sonar.result }}
      REVIEW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Persist SHA-bound reviewer result
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq ".head.sha")
          conclusion="${REVIEW_RESULT}"
          if [ "${current_sha}" != "${EXPECTED_SHA}" ]; then
            conclusion="stale"
          fi
          payload=$(jq -cn \
            --arg reviewer "Sonar" \
            --arg sha "${EXPECTED_SHA}" \
            --arg conclusion "${conclusion}" \
            --argjson run_id "${REVIEW_RUN_ID}" \
            "{schema_version:1,reviewer:\$reviewer,sha:\$sha,conclusion:\$conclusion,run_id:\$run_id}")
          encoded=$(printf '%s' "${payload}" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          body="<!-- FACTORY_REVIEWER_EVIDENCE ${encoded} -->"$'\n'"Sonar reviewer run ${REVIEW_RUN_ID} concluded \`${conclusion}\` for exact worker SHA \`${EXPECTED_SHA}\`."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" >/dev/null
          test "${conclusion}" = "success"
