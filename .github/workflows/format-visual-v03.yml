name: Temporary visual formatter v0.3

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/centro-admin-visual-v0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/centro-admin-visual-v0.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format visual candidate
        run: >-
          npx prettier --write
          src/App.tsx
          'src/components/ui/*.tsx'
          src/lib/utils.ts
          src/styles.css
          vite.config.ts
          tsconfig.json
          tsconfig.app.json
          components.json

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Format Centro visual v0.3'
          git push origin HEAD:feat/centro-admin-visual-v0.3
