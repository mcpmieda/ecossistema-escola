name: Domain smoke HeroUI Native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify deployed HeroUI Native candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify HTTP boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p domain-evidence
          root_status="$(curl --silent --show-error --output domain-evidence/root.html --write-out '%{http_code}' https://admin.escolaieda.com/)"
          me_status="$(curl --silent --show-error --output domain-evidence/api-me.json --write-out '%{http_code}' https://admin.escolaieda.com/api/me)"
          snapshot_status="$(curl --silent --show-error --output domain-evidence/api-snapshot.json --write-out '%{http_code}' https://admin.escolaieda.com/api/platform/snapshot)"
          test "${root_status}" = '200'
          test "${me_status}" = '401'
          test "${snapshot_status}" = '401'
          grep --quiet 'Centro de Administração' domain-evidence/root.html
          printf 'root=%s\napi_me=%s\napi_snapshot=%s\n' "${root_status}" "${me_status}" "${snapshot_status}" > domain-evidence/http-proof.txt

      - name: Prove deployed login motion in real time
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "${chrome}" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/domain-chrome 'https://admin.escolaieda.com/' > /tmp/domain-chrome.log 2>&1 &
          chrome_pid=$!
          cleanup() { kill "${chrome_pid}" 2>/dev/null || true; }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9222/json/list > /tmp/domain-tabs.json; then
              break
            fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:9222/json/list > /tmp/domain-tabs.json

          cat > /tmp/domain-motion.mjs <<'JS'
          import fs from 'node:fs/promises';
          const tabs = JSON.parse(await fs.readFile('/tmp/domain-tabs.json', 'utf8'));
          const target = tabs.find((entry) => entry.type === 'page' && entry.url.startsWith('https://admin.escolaieda.com'));
          if (!target?.webSocketDebuggerUrl) throw new Error('deployed page target not found');
          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let id = 0;
          const pending = new Map();
          ws.addEventListener('message', (event) => {
            const message = JSON.parse(event.data);
            if (!message.id || !pending.has(message.id)) return;
            const task = pending.get(message.id);
            pending.delete(message.id);
            if (message.error) task.reject(new Error(JSON.stringify(message.error)));
            else task.resolve(message.result);
          });
          const command = (method, params = {}) => new Promise((resolve, reject) => {
            const callId = ++id;
            pending.set(callId, { resolve, reject });
            ws.send(JSON.stringify({ id: callId, method, params }));
          });
          const evaluate = async (expression) => {
            const result = await command('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
            if (result.exceptionDetails) throw new Error(JSON.stringify(result.exceptionDetails));
            return result.result.value;
          };
          await command('Runtime.enable');
          await evaluate(`new Promise((resolve, reject) => {
            const deadline = performance.now() + 10000;
            const poll = () => {
              const layer = document.querySelector('.ambient-constellation__layer--a');
              if (layer) return resolve(true);
              if (performance.now() > deadline) return reject(new Error('constellation timeout'));
              setTimeout(poll, 100);
            };
            poll();
          })`);
          const expression = `(() => {
            const layer = document.querySelector('.ambient-constellation__layer--a');
            const particles = [...document.querySelectorAll('.ambient-constellation__particle')];
            const animation = layer.getAnimations()[0] ?? null;
            return {
              title: document.title,
              hasLogin: document.body.innerText.includes('Entre para continuar') || document.body.innerText.includes('Preparando seu acesso'),
              transform: getComputedStyle(layer).transform,
              currentTime: animation?.currentTime ?? null,
              playState: animation?.playState ?? null,
              particleCount: particles.length,
              maxParticle: Math.max(...particles.map((node) => node.getBoundingClientRect().width)),
            };
          })()`;
          const first = await evaluate(expression);
          await new Promise((resolve) => setTimeout(resolve, 3500));
          const second = await evaluate(expression);
          const proof = { first, second };
          await fs.writeFile('domain-evidence/motion-proof.json', `${JSON.stringify(proof, null, 2)}\n`);
          if (!first.hasLogin) throw new Error('login content not rendered');
          if (first.particleCount < 96) throw new Error(`particle count ${first.particleCount}`);
          if (first.maxParticle > 1.5) throw new Error(`particle size ${first.maxParticle}`);
          if (first.currentTime === null || second.currentTime === null) throw new Error('animation missing');
          if (second.currentTime - first.currentTime < 2500) throw new Error('animation clock did not advance');
          if (first.transform === second.transform) throw new Error('deployed transform did not change');
          if (first.playState !== 'running' || second.playState !== 'running') throw new Error('deployed animation not running');
          ws.close();
          console.log(JSON.stringify(proof));
          JS
          node /tmp/domain-motion.mjs

      - name: Capture deployed login desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "${chrome}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=4500 --screenshot=domain-evidence/login-desktop.png 'https://admin.escolaieda.com/'
          "${chrome}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=4500 --screenshot=domain-evidence/login-mobile.png 'https://admin.escolaieda.com/'
          test -s domain-evidence/login-desktop.png
          test -s domain-evidence/login-mobile.png

      - name: Publish smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heroui-native-domain-smoke-${{ github.run_id }}
          path: domain-evidence
          if-no-files-found: warn
          retention-days: 14
