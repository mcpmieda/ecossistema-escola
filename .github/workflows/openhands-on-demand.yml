name: OpenHands Cloud on demand

on:
  pull_request:
    paths:
      - '.github/workflows/openhands-on-demand.yml'
      - 'infra/agents/openhands_cloud.py'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owner-authored issue containing an AGENT_HANDOFF block.
        required: true
        type: string

permissions: {}

concurrency:
  group: openhands-cloud-provider
  cancel-in-progress: false

jobs:
  validate-definition:
    name: Validate OpenHands workflow definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate bounded client
        run: |
          set -euo pipefail
          python -m py_compile infra/agents/openhands_cloud.py
          test -f docs/agents/OPENHANDS_CLOUD.md
          grep -Fq 'OPENHANDS_API_KEY' docs/infra/AUTOMATION_CREDENTIAL_INVENTORY.md

  invoke:
    name: Invoke bounded OpenHands Cloud task
    if: >-
      github.event_name != 'pull_request' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            [ "$COMMENT_BODY" = "/openhands" ] || { echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
            issue="$COMMENT_ISSUE"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue="$INPUT_ISSUE"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$issue" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid issue number"; exit 1; }
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main
        if: steps.request.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and validate trusted handoff
        if: steps.request.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.request.outputs.issue }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" > "$RUNNER_TEMP/openhands-issue.json"
          jq -e --arg owner "$OWNER" '.pull_request == null and .user.login == $owner' \
            "$RUNNER_TEMP/openhands-issue.json" >/dev/null
          python infra/agents/antigravity/run.py check \
            --issue-json "$RUNNER_TEMP/openhands-issue.json" \
            --meta "$RUNNER_TEMP/openhands-meta.json"

      - name: Build bounded OpenHands prompt
        if: steps.request.outputs.run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          meta = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "openhands-meta.json").read_text(
                  encoding="utf-8"
              )
          )
          allowed = "\n".join(f"- {item}" for item in meta["allowed_paths"])
          preserve = "\n".join(f"- {item}" for item in meta["preserve"])
          do_not = "\n".join(f"- {item}" for item in meta["do_not"])
          validate = "\n".join(f"- {item}" for item in meta["validate"])
          prompt = f"""You are OpenHands, an implementation executor working under ChatGPT leadership.

Read AGENTS.md before doing anything else.

Issue #{meta['issue_number']} — {meta['issue_title']}

Goal:
{meta['goal']}

Allowed paths:
{allowed}

Preserve:
{preserve}

Do not:
{do_not}

Validation commands:
{validate}

Rules:
- Work only on the delegated task and allowed paths.
- Never read, print, infer, copy, or expose secrets, credentials, environment variables, student data, or private production data.
- Do not merge to main and do not deploy.
- If code changes are needed, create only a candidate branch or pull request through the connected OpenHands GitHub integration.
- If the task requires anything outside Allowed paths or an architectural decision, stop and explain the blocker instead of expanding scope.
"""
          if len(prompt) > 30000:
              raise SystemExit("Generated OpenHands prompt is too large.")
          (Path(os.environ["RUNNER_TEMP"]) / "openhands-prompt.txt").write_text(
              prompt,
              encoding="utf-8",
          )
          PY

      - name: Start and poll OpenHands Cloud
        if: steps.request.outputs.run == 'true'
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: |
          set -euo pipefail
          python infra/agents/openhands_cloud.py \
            --prompt "$(cat "$RUNNER_TEMP/openhands-prompt.txt")" \
            --repository "$GITHUB_REPOSITORY" \
            --branch "main" \
            --timeout-seconds 1200 \
            --poll-interval-seconds 30
