name: OpenHands Cloud on demand

on:
  pull_request:
    paths:
      - '.github/workflows/openhands-on-demand.yml'
      - 'infra/agents/openhands_cloud.py'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owner-authored issue containing an AGENT_HANDOFF block.
        required: true
        type: string

permissions: {}

concurrency:
  group: openhands-cloud-provider
  cancel-in-progress: false

jobs:
  validate-definition:
    name: Validate OpenHands workflow definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Validate bounded OpenHands client
        run: |
          set -euo pipefail
          python -m py_compile infra/agents/openhands_cloud.py
          test -f docs/agents/OPENHANDS_CLOUD.md
          grep -Fq 'OPENHANDS_API_KEY' docs/infra/AUTOMATION_CREDENTIAL_INVENTORY.md

  invoke:
    name: Invoke bounded OpenHands Cloud task
    if: >-
      github.event_name != 'pull_request' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.request.outputs.run }}
      issue: ${{ steps.request.outputs.issue }}
      status: ${{ steps.agent.outputs.status }}
      conversation_url: ${{ steps.agent.outputs.conversation_url }}
    steps:
      - name: Resolve and authorize request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "$COMMENT_BODY" != "/openhands" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            issue_number="$COMMENT_ISSUE"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue_number="$INPUT_ISSUE"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid issue number."
            exit 1
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "issue=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main
        if: steps.request.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        if: steps.request.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Fetch trusted issue
        if: steps.request.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$RUNNER_TEMP/openhands-issue.json"
          jq -e --arg owner "$REPOSITORY_OWNER" \
            '.pull_request == null and .user.login == $owner' \
            "$RUNNER_TEMP/openhands-issue.json" >/dev/null

      - name: Validate handoff before provider use
        if: steps.request.outputs.run == 'true'
        run: |
          set -euo pipefail
          python infra/agents/antigravity/run.py check \
            --issue-json "$RUNNER_TEMP/openhands-issue.json" \
            --meta "$RUNNER_TEMP/openhands-meta.json"

      - name: Confirm OpenHands credential
        if: steps.request.outputs.run == 'true'
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENHANDS_API_KEY:-}"

      - name: Execute OpenHands Cloud
        if: steps.request.outputs.run == 'true'
        id: agent
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: |
          set -euo pipefail
          python infra/agents/openhands_cloud.py \
            --meta "$RUNNER_TEMP/openhands-meta.json" \
            --repository "$GITHUB_REPOSITORY" \
            --branch main \
            --timeout-seconds 1200 \
            --poll-interval-seconds 30

  report:
    name: Report OpenHands result
    needs: invoke
    if: always() && needs.invoke.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report sanitized result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.invoke.outputs.issue }}
          STATUS: ${{ needs.invoke.outputs.status }}
          CONVERSATION_URL: ${{ needs.invoke.outputs.conversation_url }}
          INVOKE_RESULT: ${{ needs.invoke.result }}
        run: |
          set -euo pipefail
          if [ "$INVOKE_RESULT" = "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --body \
              "OpenHands Cloud concluiu com status \`$STATUS\`. Conversa: $CONVERSATION_URL"
          else
            gh issue comment "$ISSUE_NUMBER" --body \
              "A execução do OpenHands Cloud falhou fechada. Nenhuma alteração foi integrada."
          fi
