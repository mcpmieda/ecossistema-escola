name: Temporary visual QA workflow repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feat/centro-admin-visual-v0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/centro-admin-visual-v0.3

      - name: Repair visual QA harness
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/for attempt in $(seq 1 30); do/for _ in $(seq 1 30); do/' .github/workflows/visual-qa-v03.yml
          sed -i 's#cat > /tmp/visual-qa.mjs#cat > .visual-qa.mjs#' .github/workflows/visual-qa-v03.yml
          sed -i 's#node /tmp/visual-qa.mjs#node .visual-qa.mjs#' .github/workflows/visual-qa-v03.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/visual-qa-v03.yml
          git commit -m 'Fix visual QA harness'
          git push origin HEAD:feat/centro-admin-visual-v0.3
