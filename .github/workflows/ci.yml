name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_BANCO_NOTAS_ADDIN_CLIENT_ID: 73ab83d3-00ba-494a-a1f8-586d250d420a
  VITE_TENANT_ID: f04e0fa3-b8dc-4f77-be3c-7dfda0635188
  VITE_BANCO_NOTAS_RUNTIME_HOMOLOGATION: '0'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect add-in changes
        id: changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${PR_BASE_SHA}" "${GITHUB_SHA}" > /tmp/changed-files
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${PUSH_BEFORE_SHA}" "${GITHUB_SHA}" > /tmp/changed-files
          else
            printf '%s\n' 'manual-full-validation' > /tmp/changed-files
          fi
          cat /tmp/changed-files
          if grep -Eq '^(addin/banco-notas/|vite\.addin\.config\.ts$|vite\.runtime-homologation\.config\.ts$|tsconfig\.addin\.json$|tsconfig\.runtime-homologation\.json$|infra/validation/assert-banco-notas-addin-build\.mjs$)' /tmp/changed-files; then
            echo 'addin=true' >> "$GITHUB_OUTPUT"
          else
            echo 'addin=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck application
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate add-in when affected
        if: steps.changes.outputs.addin == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run verify:addin

      - name: Verify add-in output when affected
        if: steps.changes.outputs.addin == 'true' || github.event_name == 'workflow_dispatch'
        run: node infra/validation/assert-banco-notas-addin-build.mjs

  workflow-security:
    name: Validate GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect workflow changes
        id: workflows
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${PR_BASE_SHA}" "${GITHUB_SHA}" > /tmp/changed-workflow-files
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${PUSH_BEFORE_SHA}" "${GITHUB_SHA}" > /tmp/changed-workflow-files
          else
            printf '%s\n' '.github/workflows/ci.yml' > /tmp/changed-workflow-files
          fi
          if grep -Eq '^\.github/workflows/' /tmp/changed-workflow-files; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate workflows with actionlint
        if: steps.workflows.outputs.changed == 'true'
        run: bash ./infra/validation/run-actionlint.sh

      - name: Audit workflows with zizmor
        if: steps.workflows.outputs.changed == 'true'
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          online-audits: false
          persona: pedantic
          version: v1.29.0

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, workflow-security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:full

      - name: Verify Banco de Notas add-in build configuration
        run: node infra/validation/assert-banco-notas-addin-build.mjs

      - name: Deploy Cloudflare Pages
        run: >-
          npx wrangler pages deploy dist
          --project-name ecossistema-escola
          --branch main
          --commit-hash "${DEPLOY_COMMIT_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
