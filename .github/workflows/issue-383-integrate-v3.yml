        run: |
          set -euo pipefail
          rm .github/workflows/issue-383-integrate-v3.yml
          git config user.name 'mcpmieda'
          git config user.email '268288370+mcpmieda@users.noreply.github.com'
          git add server/gradebook/readiness/controlled-production-readiness-v2.ts \
            tests/gradebook/readiness/controlled-production-readiness-v2.test.ts \
            tests/gradebook/integration/wave-19-final-integration.test.ts \
