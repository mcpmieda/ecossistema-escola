name: Temporary gradebook audit evidence

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/gradebook-audit-evidence.yml]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  evidence:
    if: github.head_ref == 'fix/bn-552-bounded-import'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain the public parser already used by the application
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gradebook-parser"
          curl --fail --silent --show-error --location --retry 2 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' -o "$RUNNER_TEMP/gradebook-parser/xlsx.full.min.js"
          sha256sum "$RUNNER_TEMP/gradebook-parser/xlsx.full.min.js" > "$RUNNER_TEMP/gradebook-parser/parser-checksum.txt"
      - name: Collect existing public discussion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/comments?per_page=100" > "$RUNNER_TEMP/gradebook-parser/issue-comments.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/comments?per_page=100" > "$RUNNER_TEMP/gradebook-parser/review-comments.json"
      - name: Upload temporary public evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gradebook-audit-existing-parser
          path: ${{ runner.temp }}/gradebook-parser
          retention-days: 1
          if-no-files-found: error
