name: Format validation candidate

on:
  push:
    branches:
      - test/centro-admin-v0.2
    paths:
      - .github/workflows/format-validation.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/centro-admin-v0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format candidate
        run: npm run format

      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/platform/snapshot.ts specs/semantic-assurance.json specs/verification-plan.json src/App.tsx src/styles.css tests/platform-snapshot.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Centro v0.2 candidate"
          git push origin HEAD:test/centro-admin-v0.2
