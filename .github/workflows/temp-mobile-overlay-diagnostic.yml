name: Temporary mobile overlay diagnostic

on:
  push:
    branches:
      - fix/heroui-native-v2-performance-accessibility

permissions:
  contents: read

concurrency:
  group: temp-mobile-overlay-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose mobile drawer runtime exception
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Build candidate
        run: |
          npm ci
          npm run build

      - name: Start isolated fixture
        run: |
          cat > /tmp/server.py <<'PY'
          import json
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          defs = [
              ('overview', 'Visão geral', 'visao-geral', 'validation'),
              ('operations', 'Operação', 'operacao', 'validation'),
              ('publications', 'Publicações', 'publicacoes', 'planned'),
              ('pages', 'Páginas', 'paginas', 'planned'),
              ('systems', 'Sistemas', 'sistemas', 'validation'),
              ('audit', 'Auditoria', 'auditoria', 'validation'),
              ('settings', 'Configurações', 'configuracoes', 'validation'),
          ]
          snapshot = {
              'version': 'overlay-diagnostic',
              'releaseState': 'validation',
              'generatedAt': '2026-08-25T13:20:00.000Z',
              'correlationId': 'overlay-diagnostic',
              'foundation': {'status': 'ok', 'sharePointListCount': 12, 'expectedPlatformListsPresent': True, 'missingPlatformLists': []},
              'operational': {'status': 'nominal', 'recentAuditFailureCount': 0, 'healthContractsConfigured': 1, 'healthContractsMissing': 0, 'lastAuditAt': '2026-08-25T13:15:00.000Z', 'recoveryStatus': 'verified', 'recoveryVerifiedAt': '2026-08-25T13:10:00.000Z', 'recoveryEvidenceRef': 'fixture', 'recoveryScope': 'fixture'},
              'coreModules': [{'id': f'platform.{d[0]}', 'name': d[1], 'description': f'Área {d[1]}', 'route': d[2], 'state': d[3], 'requiredRole': 'ADMINISTRADOR', 'capabilities': ['platform.snapshot.read']} for d in defs],
              'registeredModules': [],
              'configurations': [],
              'recentAudit': [],
              'migrations': [],
          }

          class Handler(SimpleHTTPRequestHandler):
              def json(self, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  path = self.path.split('?', 1)[0]
                  if path == '/api/me':
                      return self.json({'authenticated': True, 'name': 'Administrador QA', 'roles': ['ADMINISTRADOR'], 'capabilities': ['platform.snapshot.read']})
                  if path == '/api/platform/snapshot':
                      return self.json(snapshot)
                  return super().do_GET()

              def log_message(self, *args):
                  return

          ThreadingHTTPServer(('127.0.0.1', 4173), partial(Handler, directory='dist')).serve_forever()
          PY
          python3 /tmp/server.py >/tmp/server.log 2>&1 &
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/api/me >/dev/null; then
              ready=true
              break
            fi
            echo "Fixture readiness attempt ${attempt}/30"
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/server.log
            exit 1
          fi

      - name: Start Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium not found.' >&2
            exit 1
          fi
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/chrome-overlay-diagnostic \
            --window-size=1440,900 \
            http://127.0.0.1:4173/#/visao-geral \
            >/tmp/chrome.log 2>&1 &
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null; then
              ready=true
              break
            fi
            echo "Chrome readiness attempt ${attempt}/30"
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/chrome.log
            exit 1
          fi

      - name: Reproduce and record exception
        run: |
          mkdir -p diagnostic
          cat > /tmp/diagnose.mjs <<'NODE'
          import fs from 'node:fs';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const targets = await fetch('http://127.0.0.1:9222/json/list').then((response) => response.json());
          const target = targets.find((item) => item.type === 'page');
          if (!target) throw new Error('No Chrome page target.');
          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener('open', resolve, { once: true });
            socket.addEventListener('error', reject, { once: true });
          });

          let sequence = 0;
          const pending = new Map();
          const events = [];
          socket.addEventListener('message', (event) => {
            const message = JSON.parse(event.data);
            if (message.id && pending.has(message.id)) {
              const item = pending.get(message.id);
              pending.delete(message.id);
              if (message.error) item.reject(new Error(JSON.stringify(message.error)));
              else item.resolve(message.result);
              return;
            }
            if (message.method === 'Runtime.exceptionThrown') {
              const details = message.params.exceptionDetails;
              events.push({
                type: 'exception',
                text: details.text,
                lineNumber: details.lineNumber,
                columnNumber: details.columnNumber,
                url: details.url,
                exceptionDescription: details.exception?.description,
                exceptionValue: details.exception?.value,
                stack: details.stackTrace?.callFrames?.map((frame) => ({
                  functionName: frame.functionName,
                  url: frame.url,
                  lineNumber: frame.lineNumber,
                  columnNumber: frame.columnNumber,
                })) || [],
              });
            }
            if (message.method === 'Runtime.consoleAPICalled') {
              events.push({
                type: `console.${message.params.type}`,
                args: message.params.args?.map((arg) => arg.value ?? arg.description ?? arg.type),
              });
            }
          });

          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++sequence;
            pending.set(id, { resolve, reject });
            socket.send(JSON.stringify({ id, method, params }));
          });
          const evaluate = async (expression) => {
            const response = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
            if (response.exceptionDetails) throw new Error(response.exceptionDetails.text || 'Evaluation failed');
            return response.result.value;
          };
          const waitFor = async (expression, timeout = 5000) => {
            const started = Date.now();
            while (Date.now() - started < timeout) {
              if (await evaluate(`Boolean(${expression})`)) return;
              await sleep(25);
            }
            throw new Error(`Timed out: ${expression}`);
          };
          const hitPoint = async (selector) => evaluate(`(() => {
            for (const node of document.querySelectorAll(${JSON.stringify(selector)})) {
              const rect = node.getBoundingClientRect();
              if (rect.width <= 2 || rect.height <= 2) continue;
              const left = Math.max(rect.left, 0), right = Math.min(rect.right, innerWidth);
              const top = Math.max(rect.top, 0), bottom = Math.min(rect.bottom, innerHeight);
              if (right <= left || bottom <= top) continue;
              const x = left + (right-left)/2, y = top + (bottom-top)/2;
              const hit = document.elementFromPoint(x, y);
              if (hit && (hit === node || node.contains(hit))) return {x,y};
            }
            return null;
          })()`);
          const click = async (selector, timeout = 2000) => {
            const started = Date.now();
            let point;
            while (Date.now() - started < timeout) {
              point = await hitPoint(selector);
              if (point) break;
              await sleep(30);
            }
            if (!point) throw new Error(`Not hittable: ${selector}`);
            await send('Input.dispatchMouseEvent', {type:'mouseMoved',x:point.x,y:point.y});
            await send('Input.dispatchMouseEvent', {type:'mousePressed',x:point.x,y:point.y,button:'left',clickCount:1});
            await send('Input.dispatchMouseEvent', {type:'mouseReleased',x:point.x,y:point.y,button:'left',clickCount:1});
          };
          const screenshot = async (name) => {
            const image = await send('Page.captureScreenshot', {format:'png',fromSurface:true});
            fs.writeFileSync(`diagnostic/${name}.png`, Buffer.from(image.data,'base64'));
          };

          await send('Runtime.enable');
          await send('Page.enable');
          await waitFor(`document.querySelectorAll('.platform-nav a[href^="#/"]').length === 7`, 8000);
          await send('Emulation.setDeviceMetricsOverride', {width:390,height:844,deviceScaleFactor:1,mobile:true});
          await sleep(300);
          await screenshot('before-menu');
          await click('button[aria-label="Abrir navegação"]');
          await sleep(500);
          await screenshot('menu-open');
          await click('.platform-nav a[href="#/operacao"]');
          await waitFor(`location.hash === '#/operacao'`);
          await sleep(1000);
          await screenshot('after-navigation');

          const state = await evaluate(`({
            href: location.href,
            hash: location.hash,
            bodyText: document.body.innerText.slice(0, 2000),
            bodyHtmlLength: document.body.innerHTML.length,
            rootHtmlLength: document.querySelector('#root')?.innerHTML.length ?? null,
            searchButtons: document.querySelectorAll('button[aria-label="Buscar no Centro"]').length,
            menuButtons: document.querySelectorAll('button[aria-label="Abrir navegação"]').length,
            platformShells: document.querySelectorAll('.platform-shell').length,
          })`);
          fs.writeFileSync('diagnostic/runtime.json', JSON.stringify({state, events}, null, 2));
          console.log(JSON.stringify({state, events}, null, 2));
          socket.close();
          NODE
          node /tmp/diagnose.mjs

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-overlay-runtime-diagnostic
          path: diagnostic
          if-no-files-found: error
          retention-days: 7
