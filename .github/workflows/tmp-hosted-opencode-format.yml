name: Temporary Hosted OpenCode Format Diff

on:
  pull_request:
    paths:
      - 'infra/factory/hosted-opencode-executor.mjs'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write infra/factory/hosted-opencode-executor.mjs
          git diff -- infra/factory/hosted-opencode-executor.mjs
          test -z "$(git status --short infra/factory/hosted-opencode-executor.mjs)"
