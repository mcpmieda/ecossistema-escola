name: M365 operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Allowed Microsoft 365 operation
        required: true
        type: choice
        options:
          - identity-check
          - sharepoint-health
          - banco-notas-readiness

permissions:
  contents: read

concurrency:
  group: m365-operations-production
  cancel-in-progress: false

jobs:
  operate:
    name: Execute M365 operation
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Execute allowlisted Microsoft 365 operation
        run: |
          set -o pipefail
          node infra/ops/m365-operations.mjs | tee m365-operations-audit.jsonl
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_OPERATIONS_CLIENT_ID: ${{ vars.ENTRA_OPERATIONS_CLIENT_ID }}
          SHAREPOINT_SITE_ID: ${{ vars.SHAREPOINT_SITE_ID }}
          M365_OPERATION: ${{ inputs.operation }}

      - name: Publish redacted operation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m365-operation-${{ github.run_id }}
          path: m365-operations-audit.jsonl
          if-no-files-found: error
          retention-days: 90
