name: Bootstrap M365 operations identity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m365-operations-identity-bootstrap-production
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap M365 operations identity
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC federation with the Entra maintenance app during sealed bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Bootstrap dedicated Entra identity
        run: |
          set -o pipefail
          node infra/ops/bootstrap-m365-operations-identity.mjs | tee m365-operations-identity-bootstrap.jsonl
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_MAINTENANCE_CLIENT_ID: ${{ vars.ENTRA_MAINTENANCE_CLIENT_ID }}

      - name: Publish bootstrap evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m365-operations-identity-bootstrap-${{ github.run_id }}
          path: m365-operations-identity-bootstrap.jsonl
          if-no-files-found: error
          retention-days: 90
