name: Factory Control Plane

on:
  pull_request:
    paths:
      - 'infra/factory/**'
      - '.github/workflows/factory-control-plane.yml'
      - '.github/workflows/factory-hosted-opencode.yml'
      - '.github/workflows/factory-reconcile.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/merge-train-semgrep.yml'
      - '.github/workflows/merge-train-sonar.yml'
      - 'docs/FACTORY_CONTROL_PLANE.md'
      - 'docs/FACTORY_RUN_ISSUE_FORMAT.md'
      - 'docs/FACTORY_JULES_PILOT_2026-08-26.md'
      - 'docs/FACTORY_DURABLE_PROVIDERS.md'
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      operation:
        description: Trusted durable provider gateway operation.
        required: true
        type: choice
        options:
          - claim
          - heartbeat
          - result
          - health
      issue_number:
        description: Materialized Factory task issue number.
        required: true
        type: string
      worker_id:
        description: Stable executor identifier; no credentials or personal profile paths.
        required: true
        type: string
      payload:
        description: JSON health, heartbeat, or result payload. Never place secrets here.
        required: true
        default: '{}'
        type: string
      ttl_seconds:
        description: Lease TTL for claim, from 60 through 21600 seconds.
        required: false
        default: '1800'
        type: string

permissions: {}

concurrency:
  group: factory-control-plane-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Factory Control Plane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Factory Control Plane syntax
        run: >-
          node --check infra/factory/control-plane.mjs &&
          node --check infra/factory/dispatch-policy.mjs &&
          node --check infra/factory/reconciliation-policy.mjs &&
          node --check infra/factory/reconcile.mjs &&
          node --check infra/factory/contract-v2.mjs &&
          node --check infra/factory/github-api.mjs &&
          node --check infra/factory/jules-api.mjs &&
          node --check infra/factory/materialize-v2.mjs &&
          node --check infra/factory/runner-v2.mjs &&
          node --check infra/factory/durable-provider-contract.mjs &&
          node --check infra/factory/durable-provider-gateway.mjs &&
          node --check infra/factory/hosted-opencode-executor.mjs &&
          node --check infra/factory/merge-train-gate.mjs &&
          node --check infra/factory/validate-v2.mjs
      - name: Test Factory contracts and provider guardrails
        run: >-
          node --test
          infra/factory/dispatch-policy.test.mjs
          infra/factory/reconciliation-policy.test.mjs
          infra/factory/contract-v2.test.mjs
          infra/factory/github-api.test.mjs
          infra/factory/jules-api.test.mjs
          infra/factory/runner-v2.test.mjs
          infra/factory/durable-provider-contract.test.mjs
          infra/factory/durable-provider-gateway.test.mjs
          infra/factory/hosted-opencode-executor.test.mjs
          infra/factory/merge-train-gate.test.mjs
      - name: Validate legacy Banco de Notas Factory Run fixture
        run: node infra/factory/control-plane.mjs validate-file infra/factory/examples/banco-notas-pilot-issue.txt
      - name: Validate API-first Jules Factory Run fixture
        run: node infra/factory/validate-v2.mjs infra/factory/examples/jules-api-pilot-issue.txt

  materialize:
    name: Materialize isolated Factory Run
    if: >-
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[Factory Run]') &&
      contains(github.event.issue.body, '<!-- FACTORY_RUN_BEGIN -->') &&
      contains(github.event.issue.body, '<!-- FACTORY_RUN_END -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Required only to create/reuse the isolated factory/<run_id> integration branch.
      issues: write # Required only to materialize typed task issues, labels, and audit comments.
    steps:
      - name: Checkout trusted Control Plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Materialize API-first Factory Run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FACTORY_PARENT_ISSUE: ${{ github.event.issue.number }}
        run: node infra/factory/materialize-v2.mjs

  run-factory:
    name: Run bounded multi-provider Factory
    if: >-
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[Factory Run]') &&
      contains(github.event.issue.body, '<!-- FACTORY_RUN_BEGIN -->') &&
      contains(github.event.issue.body, '<!-- FACTORY_RUN_END -->')
    needs: [materialize]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write # Required only to dispatch the fixed ci.yml workflow on worker/integration branches.
      contents: write # Required only to synchronize and merge validated worker PRs into the isolated integration branch.
      issues: write # Required only for typed task state labels, audit comments, and closing completed task issues.
      pull-requests: write # Required only to inspect/merge worker PRs and create the final draft PR; target merge is forbidden by policy.
    steps:
      - name: Checkout trusted Control Plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run bounded multiagent orchestration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FACTORY_PARENT_ISSUE: ${{ github.event.issue.number }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: node infra/factory/runner-v2.mjs

  durable-provider-gateway:
    name: Reconcile durable provider executor
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write # Dispatch exact-SHA ci.yml only.
      contents: write # Create/synchronize worker branches and integrate into the isolated Factory branch only.
      issues: write # Persist bot-authored leases, health, heartbeat, result, labels, and task closure.
      pull-requests: write # Create/inspect/merge worker PRs only; final target merge remains forbidden.
    steps:
      - name: Checkout trusted Control Plane from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Run durable provider gateway
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FACTORY_PROVIDER_OPERATION: ${{ inputs.operation }}
          FACTORY_PROVIDER_ISSUE: ${{ inputs.issue_number }}
          FACTORY_PROVIDER_WORKER: ${{ inputs.worker_id }}
          FACTORY_PROVIDER_PAYLOAD: ${{ inputs.payload }}
          FACTORY_PROVIDER_TTL_SECONDS: ${{ inputs.ttl_seconds }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: node infra/factory/durable-provider-gateway.mjs
