name: Visual QA ambient constellation

on:
  push:
    branches:
      - test/heroui-v0.9-constellation-scale
    paths:
      - src/components/ambient-constellation.tsx
      - src/styles.css
      - .github/workflows/visual-qa-constellation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-constellation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Capture real Chrome visual evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "${chrome}"

          python3 -m http.server 4173 --directory dist >/tmp/visual-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          sleep 1

          "${chrome}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=4000 \
            --screenshot=browser-evidence/desktop-login.png \
            --dump-dom \
            http://127.0.0.1:4173/ > browser-evidence/desktop-login-dom.html

          "${chrome}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --virtual-time-budget=4000 \
            --screenshot=browser-evidence/mobile-login.png \
            http://127.0.0.1:4173/

          grep --quiet --fixed-strings 'Entrar com conta institucional' browser-evidence/desktop-login-dom.html

          python3 <<'PY'
          from pathlib import Path
          import json

          identity = {
              "authenticated": True,
              "name": "Validação Visual",
              "roles": ["ADMINISTRADOR"],
              "capabilities": [
                  "platform.snapshot.read",
                  "platform.overview.read",
                  "platform.health.read",
                  "publications.read",
                  "pages.read",
                  "platform.modules.read",
                  "platform.audit.read",
                  "platform.settings.read",
              ],
          }
          modules = [
              ["overview", "Visão geral", "Síntese administrativa", "visao-geral", ["platform.overview.read"]],
              ["operation", "Operação", "Saúde e continuidade", "operacao", ["platform.health.read"]],
              ["publications", "Publicações", "Área editorial planejada", "publicacoes", ["publications.read"]],
              ["pages", "Páginas", "Páginas institucionais planejadas", "paginas", ["pages.read"]],
              ["systems", "Sistemas", "Catálogo de integrações", "sistemas", ["platform.modules.read"]],
              ["audit", "Auditoria", "Rastreabilidade administrativa", "auditoria", ["platform.audit.read"]],
              ["settings", "Configurações", "Governança da plataforma", "configuracoes", ["platform.settings.read"]],
          ]
          snapshot = {
              "version": "v0.9-visual-qa",
              "releaseState": "validation",
              "generatedAt": "2026-08-25T08:45:00.000Z",
              "correlationId": "visual-qa-constellation-20260825",
              "foundation": {
                  "status": "ok",
                  "sharePointListCount": 8,
                  "expectedPlatformListsPresent": True,
                  "missingPlatformLists": [],
              },
              "operational": {
                  "status": "nominal",
                  "recentAuditFailureCount": 0,
                  "healthContractsConfigured": 2,
                  "healthContractsMissing": 0,
                  "lastAuditAt": "2026-08-25T08:40:00.000Z",
                  "recoveryStatus": "verified",
                  "recoveryVerifiedAt": "2026-08-25T08:30:00.000Z",
                  "recoveryEvidenceRef": "visual-qa",
                  "recoveryScope": "visual-fixture",
              },
              "coreModules": [
                  {
                      "id": mid,
                      "name": name,
                      "description": description,
                      "route": route,
                      "state": "validation" if route not in ["publicacoes", "paginas"] else "planned",
                      "requiredRole": "ADMINISTRADOR",
                      "capabilities": capabilities,
                  }
                  for mid, name, description, route, capabilities in modules
              ],
              "registeredModules": [],
              "configurations": [
                  {
                      "id": "cfg-1",
                      "key": "platform.releaseState",
                      "scope": "platform",
                      "version": "1",
                      "active": True,
                      "effectiveFrom": "2026-08-25T00:00:00.000Z",
                      "effectiveUntil": "",
                      "updatedAt": "2026-08-25T08:40:00.000Z",
                  }
              ],
              "recentAudit": [],
              "migrations": [],
          }
          mock = f"""
          <script>
          (() => {{
            const identity = {json.dumps(identity)};
            const snapshot = {json.dumps(snapshot)};
            const originalFetch = window.fetch.bind(window);
            window.fetch = async (input, init) => {{
              const url = typeof input === 'string' ? input : input.url;
              if (url === '/api/me' || url.endsWith('/api/me')) {{
                return new Response(JSON.stringify(identity), {{status: 200, headers: {{'Content-Type': 'application/json'}}}});
              }}
              if (url === '/api/platform/snapshot' || url.endsWith('/api/platform/snapshot')) {{
                return new Response(JSON.stringify(snapshot), {{status: 200, headers: {{'Content-Type': 'application/json'}}}});
              }}
              return originalFetch(input, init);
            }};
          }})();
          </script>
          """
          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          index.write_text(html.replace('</head>', mock + '</head>'), encoding='utf-8')
          PY

          "${chrome}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=5000 \
            --screenshot=browser-evidence/desktop-overview.png \
            --dump-dom \
            http://127.0.0.1:4173/#/visao-geral > browser-evidence/desktop-overview-dom.html

          "${chrome}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --virtual-time-budget=5000 \
            --screenshot=browser-evidence/mobile-overview.png \
            http://127.0.0.1:4173/#/visao-geral

          "${chrome}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --force-prefers-reduced-motion \
            --window-size=1440,900 \
            --virtual-time-budget=3000 \
            --screenshot=browser-evidence/desktop-overview-reduced-motion.png \
            http://127.0.0.1:4173/#/visao-geral

          grep --quiet --fixed-strings 'Operação da plataforma' browser-evidence/desktop-overview-dom.html
          particle_count="$(grep -o 'ambient-constellation__particle' browser-evidence/desktop-overview-dom.html | wc -l | tr -d ' ')"
          test "${particle_count}" -ge 56
          ! grep -Eq 'width: ([2-9]|[1-9][0-9])([.]|px)' browser-evidence/desktop-overview-dom.html

          test -s browser-evidence/desktop-login.png
          test -s browser-evidence/mobile-login.png
          test -s browser-evidence/desktop-overview.png
          test -s browser-evidence/mobile-overview.png
          test -s browser-evidence/desktop-overview-reduced-motion.png

      - name: Publish visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-qa-constellation-${{ github.run_id }}
          path: browser-evidence
          if-no-files-found: warn
          retention-days: 14
