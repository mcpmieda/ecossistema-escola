name: Antigravity on demand

on:
  pull_request:
    paths:
      - '.github/workflows/antigravity-on-demand.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owner-authored issue containing an AGENT_HANDOFF block.
        required: true
        type: string

permissions: {}

concurrency:
  group: antigravity-provider
  cancel-in-progress: false

jobs:
  validate-definition:
    name: Validate Antigravity workflow definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Confirm workflow compiled
        run: echo "Antigravity workflow compiled successfully."

  execute:
    name: Execute bounded Antigravity task
    if: github.event_name != 'pull_request' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Provider execution placeholder
        run: echo "Operational steps are restored only after definition validation passes."
