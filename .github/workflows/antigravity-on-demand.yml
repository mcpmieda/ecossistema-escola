name: Antigravity on demand

on:
  pull_request:
    paths:
      - '.github/workflows/antigravity-on-demand.yml'
      - 'infra/agents/antigravity/run.py'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owner-authored issue containing an AGENT_HANDOFF block.
        required: true
        type: string

permissions: {}

concurrency:
  group: antigravity-provider
  cancel-in-progress: false

jobs:
  validate-definition:
    name: Validate Antigravity workflow definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install pinned Antigravity SDK
        run: python -m pip install --disable-pip-version-check --no-input "google-antigravity==0.1.17"

      - name: Validate SDK compatibility
        run: python infra/agents/antigravity/run.py sdk-check

  execute:
    name: Execute bounded Antigravity task
    if: >-
      github.event_name != 'pull_request' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Resolve and authorize request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "$COMMENT_BODY" != "/antigravity" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            issue_number="$COMMENT_ISSUE"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue_number="$INPUT_ISSUE"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid issue number."
            exit 1
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main
        if: steps.request.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch trusted issue
        if: steps.request.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$RUNNER_TEMP/antigravity-issue.json"
          jq -e --arg owner "$REPOSITORY_OWNER"             '.pull_request == null and .user.login == $owner'             "$RUNNER_TEMP/antigravity-issue.json" >/dev/null

      - name: Set up Python
        if: steps.request.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Validate handoff before provider use
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python infra/agents/antigravity/run.py check             --issue-json "$RUNNER_TEMP/antigravity-issue.json"             --meta "$RUNNER_TEMP/antigravity-meta.json"

      - name: Detect duplicate handoff
        if: steps.request.outputs.run == 'true'
        id: dedupe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.number }}
        run: |
          set -euo pipefail
          handoff_hash="$(jq -r '.handoff_hash' "$RUNNER_TEMP/antigravity-meta.json")"
          marker="<!-- antigravity-handoff:${handoff_hash} -->"
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100"             --jq '.[].body' | grep -Fq "$marker"; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --body               "Este handoff já teve uma execução concluída do Antigravity. Nenhuma nova cota foi consumida."
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm Antigravity credential
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body               "Antigravity não foi executado: o Repository Secret GEMINI_API_KEY ainda não está configurado."
            echo "::error::GEMINI_API_KEY is not configured."
            exit 1
          fi

      - name: Set up Node.js
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies when requested
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true'
        shell: bash
        run: |
          set -euo pipefail
          needs_node="$(jq -r '.needs_node' "$RUNNER_TEMP/antigravity-meta.json")"
          if [ "$needs_node" = "true" ]; then
            npm ci
          else
            echo "Node validation not requested; npm ci skipped."
          fi

      - name: Install pinned Antigravity SDK
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input "google-antigravity==0.1.17"

      - name: Execute Antigravity without GitHub credentials
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true'
        id: agent
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python infra/agents/antigravity/run.py run             --root "$GITHUB_WORKSPACE"             --meta "$RUNNER_TEMP/antigravity-meta.json"             --summary "$RUNNER_TEMP/antigravity-summary.json"             --result "$RUNNER_TEMP/antigravity-result.json"
          echo "has_changes=$(jq -r '.has_changes' "$RUNNER_TEMP/antigravity-result.json")" >> "$GITHUB_OUTPUT"


      - name: Render safe execution summary
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          summary = json.loads((root / "antigravity-summary.json").read_text(encoding="utf-8"))
          result = json.loads((root / "antigravity-result.json").read_text(encoding="utf-8"))
          meta = json.loads((root / "antigravity-meta.json").read_text(encoding="utf-8"))
          response = str(summary.get("response") or "").strip()
          if len(response) > 6000:
              response = response[:6000] + "\n\n[resumo truncado pelo workflow]"
          changed = result.get("changed_paths") or []
          lines = [
              "### Antigravity — resultado",
              "",
              response or "_Sem texto de resposta._",
              "",
              "**Arquivos modificados:**",
          ]
          lines.extend(f"- `{path}`" for path in changed)
          if not changed:
              lines.append("- nenhum")
          lines.extend(["", f"<!-- antigravity-handoff:{meta['handoff_hash']} -->"])
          (root / "antigravity-comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Report no-change execution
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true' && steps.agent.outputs.has_changes == 'false' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/antigravity-comment.md"

      - name: Create isolated branch for validated changes
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true' && steps.agent.outputs.has_changes == 'true' && success()
        id: branch
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.request.outputs.number }}
        run: |
          set -euo pipefail
          branch_name="antigravity/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch_name"
          echo "name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Commit validated changes
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true' && steps.agent.outputs.has_changes == 'true' && success()
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.request.outputs.number }}
        run: |
          set -euo pipefail
          git config user.name "Antigravity Agent"
          git config user.email "antigravity-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "agent(antigravity): issue #${ISSUE_NUMBER}"

      - name: Push isolated branch
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true' && steps.agent.outputs.has_changes == 'true' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "HEAD:refs/heads/${BRANCH_NAME}"


      - name: Open draft pull request
        if: steps.request.outputs.run == 'true' && steps.dedupe.outputs.duplicate != 'true' && steps.agent.outputs.has_changes == 'true' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.number }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          title="$(jq -r '.issue_title' "$RUNNER_TEMP/antigravity-meta.json")"
          handoff_hash="$(jq -r '.handoff_hash' "$RUNNER_TEMP/antigravity-meta.json")"
          {
            echo "Antigravity executou o handoff da issue #${ISSUE_NUMBER}."
            echo
            cat "$RUNNER_TEMP/antigravity-comment.md"
            echo
            echo "Este PR é uma entrega candidata. Revisão do agente líder e CI continuam obrigatórios."
            echo
            echo "Closes #${ISSUE_NUMBER}"
          } > "$RUNNER_TEMP/antigravity-pr.md"

          set +e
          pr_url="$(gh pr create --draft --base main --head "$BRANCH_NAME"             --title "[Antigravity] $title"             --body-file "$RUNNER_TEMP/antigravity-pr.md")"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            {
              echo "Antigravity concluiu a tarefa e abriu um PR em draft:"
              echo "$pr_url"
              echo
              echo "<!-- antigravity-handoff:$handoff_hash -->"
            } > "$RUNNER_TEMP/antigravity-published.md"
          else
            branch_url="https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH_NAME}"
            {
              echo "Antigravity concluiu a tarefa e publicou a branch, mas o GitHub Actions não pôde abrir o PR automaticamente:"
              echo "$branch_url"
              echo
              echo "<!-- antigravity-handoff:$handoff_hash -->"
            } > "$RUNNER_TEMP/antigravity-published.md"
          fi

          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/antigravity-published.md"

      - name: Report failed execution
        if: failure() && steps.request.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body             "A execução do Antigravity falhou fechada e nenhuma alteração foi mesclada. Consulte o workflow run ${GITHUB_RUN_ID}."
