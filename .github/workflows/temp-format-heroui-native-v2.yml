name: Temporary format HeroUI Native v2

on:
  push:
    branches:
      - redesign/heroui-native-v2
    paths:
      - .github/workflows/temp-format-heroui-native-v2.yml

permissions:
  contents: write

jobs:
  format:
    name: Format candidate sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: redesign/heroui-native-v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format source
        run: npm run format

      - name: Commit formatted candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'style(ui): formatar HeroUI Native v2'
          git push origin HEAD:redesign/heroui-native-v2
