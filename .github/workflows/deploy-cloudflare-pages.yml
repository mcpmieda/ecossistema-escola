name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure private production binding
        shell: bash
        env:
          GRADEBOOK_D1_BINDING_CONFIG: ${{ secrets.GRADEBOOK_D1_BINDING_CONFIG }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const configPath = 'wrangler.jsonc';
          const config = JSON.parse(await readFile(configPath, 'utf8'));
          const rawBinding = process.env.GRADEBOOK_D1_BINDING_CONFIG;

          if (!rawBinding) {
            throw new Error('GRADEBOOK_D1_BINDING_CONFIG is not configured.');
          }

          const binding = JSON.parse(rawBinding);
          if (
            binding?.binding !== 'GRADEBOOK_D1' ||
            typeof binding.database_name !== 'string' ||
            binding.database_name.length === 0 ||
            typeof binding.database_id !== 'string' ||
            binding.database_id.length === 0
          ) {
            throw new Error('GRADEBOOK_D1_BINDING_CONFIG is invalid.');
          }

          config.env ??= {};
          config.env.production = {
            ...(config.env.production ?? {}),
            vars: config.vars ?? {},
            d1_databases: [binding],
          };

          await writeFile(configPath, `${JSON.stringify(config, null, 2)}\n`, 'utf8');
          NODE

      - name: Deploy Cloudflare Pages
        run: >-
          npx wrangler pages deploy dist
          --project-name ecossistema-escola
          --branch main
          --commit-hash "${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply gradebook staging migration when introduced
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- migrations/gradebook/0006_import_staging_v1.sql; then
            echo "Migration 0006 unchanged in this deployment; skipping."
            exit 0
          fi

          npx wrangler d1 execute GRADEBOOK_D1 \
            --env production \
            --remote \
            --file migrations/gradebook/0006_import_staging_v1.sql \
            --yes

          AUDIT_SQL=$(cat <<'SQL'
          SELECT 'schema_version' AS metric, COALESCE(MAX(version), 0) AS value
            FROM gradebook_schema_migrations
          UNION ALL
          SELECT 'logical_sources', COUNT(*) FROM logical_sources
          UNION ALL
          SELECT 'source_file_streams', COUNT(*) FROM source_file_streams
          UNION ALL
          SELECT 'import_batch_streams', COUNT(*) FROM import_batch_streams
          UNION ALL
          SELECT 'association_streams', COUNT(*) FROM logical_source_record_streams
          UNION ALL
          SELECT 'stage_sessions', COUNT(*) FROM gradebook_import_stage_sessions
          UNION ALL
          SELECT 'stage_chunks', COUNT(*) FROM gradebook_import_stage_chunks
          UNION ALL
          SELECT 'entity_stream:' || entity_kind, COUNT(*)
            FROM academic_entity_streams GROUP BY entity_kind
          UNION ALL
          SELECT 'entity_version:' || entity_kind, COUNT(*)
            FROM academic_entity_versions GROUP BY entity_kind
          UNION ALL
          SELECT 'record_stream:' || record_kind, COUNT(*)
            FROM academic_record_streams GROUP BY record_kind
          UNION ALL
          SELECT 'record_version:' || record_kind, COUNT(*)
            FROM academic_record_versions GROUP BY record_kind
          ORDER BY metric;
          SQL
          )
          echo "Sanitized gradebook persistence audit (counts only):"
          npx wrangler d1 execute GRADEBOOK_D1 \
            --env production \
            --remote \
            --command "$AUDIT_SQL" \
            --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
