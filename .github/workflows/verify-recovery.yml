name: Verify recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-recovery.yml'
      - 'functions/[[path]].ts'
      - 'infra/maintenance/verify-recovery.mjs'
      - 'server/auth/github-oidc.ts'
      - 'server/platform/recovery.ts'

permissions:
  contents: read

concurrency:
  group: verify-recovery-production
  cancel-in-progress: false

jobs:
  verify-recovery:
    name: Verify recovery without production data
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # required only to authenticate this production-environment recovery check with GitHub OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild source as recovery evidence
        run: npm run build

      - name: Verify disposable SharePoint backup and restore round trip
        shell: bash
        run: |
          set -o pipefail
          node infra/maintenance/verify-recovery.mjs | tee recovery-audit.jsonl

      - name: Publish redacted recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-verification-${{ github.run_id }}
          path: recovery-audit.jsonl
          if-no-files-found: error
          retention-days: 90
