name: Format HeroUI validation branch

on:
  push:
    branches:
      - test/heroui-v0.9
    paths:
      - .github/workflows/format-heroui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/heroui-v0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run format

      - name: Commit formatting when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style(ui): formatar migração HeroUI v0.9"
          git push origin HEAD:test/heroui-v0.9
