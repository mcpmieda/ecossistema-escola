name: Temporary v0.4 cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: cleanup-v04-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Clean v0.4 dependencies and formatting
    if: github.head_ref == 'feat/centro-admin-v0.4-search-modularization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v0.4 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/centro-admin-v0.4-search-modularization

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove disposable Playwright dependency
        run: npm uninstall playwright

      - name: Format v0.4 sources
        run: npm run format

      - name: Verify application
        run: npm run verify

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/App.tsx src/platform/pages.tsx
          git commit -m 'Clean v0.4 dependencies and formatting'
          git push origin HEAD:feat/centro-admin-v0.4-search-modularization
