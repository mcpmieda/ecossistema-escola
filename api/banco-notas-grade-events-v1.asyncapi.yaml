asyncapi: 3.1.0
info:
  title: Banco de Notas — eventos de sincronização
  version: 1.1.0
  description: >-
    Contrato do stream autenticado de confirmações do Banco de Notas. Migra a semântica
    validada na POC para o repositório definitivo, sem declarar o stream como ativo antes
    da implementação e do gate Microsoft Entra.
servers:
  production:
    host: admin.escolaieda.com
    protocol: https
    pathname: /api/banco-notas
    description: Endpoint same-origin do Ecossistema Escolar; escrita do add-in depende de audience/scope Entra homologados.
channels:
  gradeEvents:
    address: /v1/grade-events/stream
    messages:
      gradeEventReceipt:
        $ref: '#/components/messages/GradeEventReceipt'
operations:
  receiveGradeEvents:
    action: receive
    channel:
      $ref: '#/channels/gradeEvents'
    summary: Consumidor autenticado acompanha confirmações auditáveis de eventos
    messages:
      - $ref: '#/channels/gradeEvents/messages/gradeEventReceipt'
components:
  messages:
    GradeEventReceipt:
      name: GradeEventReceipt
      title: Confirmação de evento de nota
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        type: object
        additionalProperties: false
        required:
          - schemaVersion
          - eventId
          - correlationId
          - idempotencyKey
          - eventType
          - gradeKey
          - field
          - sequence
          - status
          - receivedAt
        properties:
          schemaVersion:
            const: 1
          eventId:
            type: string
            format: uuid
          correlationId:
            type: string
            format: uuid
          idempotencyKey:
            type: string
          eventType:
            type: string
            enum: [grade.changed, grade.recalculated, grade.reverted]
          gradeKey:
            type: string
            minLength: 7
            maxLength: 180
            example: 2026|T01|M|aluno-sintetico-001
          field:
            type: string
            enum: [NotaT1, NotaT2, NotaT3, RecT1, RecT2, RecT3, Total, TotalRec, NotaFinal]
          valueAfter:
            oneOf:
              - type: number
              - type: string
                maxLength: 120
              - type: 'null'
          isAbsent:
            type: boolean
            description: Ausência explícita; zero permanece valor numérico válido.
          sequence:
            type: integer
            minimum: 1
          status:
            type: string
            enum: [applied, stale, duplicate, queued, rejected]
          clientSentAt:
            type: string
            format: date-time
          receivedAt:
            type: string
            format: date-time
          sourceKind:
            type: string
            enum: [excel-addin, web-model, reconciliation]
          sourceId:
            type: string
            format: uuid
          teacherModelId:
            type: string
            format: uuid
