<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#173f63" />
    <title>Página não encontrada</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #18181b; background: #f4f4f5; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(560px, 100%); background: white; border: 1px solid #e4e4e7; border-radius: 24px; padding: 32px; box-sizing: border-box; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 24px; color: #52525b; line-height: 1.6; }
      a { display: inline-block; color: #173f63; font-weight: 600; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>Página não encontrada</h1>
      <p>O endereço informado não existe no Centro de Administração.</p>
      <a href="/">Voltar ao Centro de Administração</a>
    </main>
  </body>
</html>
